<style>
  /* Stage: 1600×1200, the 4:3 plate of the site's chat case (media/moex-chat is 1600×1200 too).
     Nothing here moves by itself: no transitions, no keyframes. Every moving value is written by seek(t). */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; background: #000; font-family: Inter, system-ui, sans-serif; font-synthesis: none; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; left: 0; top: 0; width: 1600px; height: 1200px; overflow: hidden; transform-origin: 0 0; }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }   /* the camera; never will-change */
  .a { position: absolute; left: 0; top: 0; }
  .t { position: absolute; white-space: nowrap; }
  .i { position: absolute; overflow: visible; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ov { overflow: hidden; }
  svg.a { overflow: visible; }
  #cursor { position: absolute; left: 0; top: 0; overflow: visible; }
  /* preview chrome, not part of the frame */
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
         padding: 6px 8px; border-radius: 10px; background: #202020; color: #f0f0f0; font: 500 12px/16px Inter, sans-serif; }
  #bar[hidden] { display: none; }
  #bar button { font: inherit; color: inherit; background: #303030; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #bar input { width: 320px; accent-color: #7d3ee3; }
  #bar output { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
</style>

const SPR = {                                 // [response s, damping ratio]; ζ ≥ .8 keeps overshoot ≤ 1.5 %
  snap: [0.2, 0.95], blink: [0.13, 1], out: [0.18, 1], in: [0.3, 1], fade: [0.26, 1],
  ui: [0.42, 0.86], morph: [0.56, 0.86], big: [0.8, 0.88], cam: [0.74, 0.92], cur: [0.4, 0.88],
  drag: [0.3, 0.9], tick: [0.28, 0.82], eq: [0.34, 0.82], slow: [1.4, 1],

function step(tau, sp) {                      // unit step response of a damped spring, closed form

  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);

}

  const v0 = ks[ks.length - 1].v, vec = Array.isArray(v0), ds = [];
  ks.forEach((k, i) => {

    const d = vec ? k.v.map((x, j) => x - p[j]) : k.v - p;
    if (vec ? d.some(x => x !== 0) : d !== 0) ds.push({ t: k.t, d, sp: k.sp });

  if (!vec) return t => { let v = v0; for (const k of ds) v += k.d * (step(t - k.t, k.sp) + step(t - k.t + LOOP, k.sp)); return v; };
  return t => {
    const v = v0.slice();

// the strum: press above the top string, drag down through all three (each one snaps on a 16th), release below
function strum(which, bMove, bPress, [ox, oy]) {
  const sx = 150, ys = STRINGS.map(s => yAt(s.samples, sx));
  move(bMove, [ox + sx, oy + ys[0] - 9]);
  CUR.s.push([bPress, 0.8, 'snap'], [bPress + 1.1, 1, 'snap']);
  cue(bPress, 'press', { ui: 'grab' }); cue(bPress + 1.1, 'release', { ui: 'grab' });
  ys.forEach((y, i) => {
    const b = bPress + 0.2 + 0.25 * i;
    move(b - 0.15, [ox + sx + 4 * i, oy + y + 4], 'drag');
    PLUCKS[which].push({ s: i, t: (b + 0.12) * BEAT });
    cue(b + 0.12, 'pluck', { string: i });
  });
  move(bPress + 0.9, [ox + sx + 12, oy + ys[2] + 13], 'drag');
}

const D = {};
let EQ = null, EQ_FRAMES = 0, EQ_BANDS = 9;

function build() {
  document.body.style.background = K.canvas;
  const frame = document.getElementById('frame'), world = document.getElementById('world');
  frame.style.background = K.canvas;
  STRINGS.forEach(s => { s.samples = sampleBez(s.d).sort((a, b) => a[0] - b[0]); });
  CURVES.forEach(c => {
    const raw = sampleBez(c.d);
    c.samples = raw.slice().sort((a, b) => a[0] - b[0]);
    c.dots = dashXs(raw, c.gap, 48, 795);
  });
  timeline();
  const raw = atob(DATA.eq.b64); EQ = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) EQ[i] = raw.charCodeAt(i);
  EQ_BANDS = DATA.eq.bands; EQ_FRAMES = EQ.length / EQ_BANDS;

  D.glow = box(world, 0, 0, 0, 0, { filter: 'blur(12px)' });
  D.shape = box(world, 0, 0, 0, 0, { overflow: 'hidden' });
  D.inner = el('div', 'a', D.shape);

// the eye: Lucide eye (open) and eye-closed (shut) are the two ends of one set of lids
function eye(parent) {
  const s = sv('svg', { class: 'i', viewBox: '0 0 24 24', width: 16, height: 16 }, parent);
  const id = 'eye' + Math.random().toString(36).slice(2, 8);
  const cp = sv('clipPath', { id }, sv('defs', {}, s));
  const clip = sv('path', {}, cp);
  const pupil = sv('circle', { cx: 12, cy: 12, r: 3, 'clip-path': `url(#${id})` }, s);
  const up = sv('path', {}, s), lo = sv('path', {}, s);
  const lashes = [[15, 18, 14.278, 14.75], [20, 15, 18.274, 12.95], [4, 15, 5.726, 12.95], [9, 18, 9.722, 14.75]].map(l => ({ l, e: sv('path', {}, s) }));
  return { s, clip, pupil, up, lo, lashes };
}
function drawEye(E, o) {                      // o: 1 open (Lucide eye), 0 shut (Lucide eye-closed)
  o = clamp(o, -0.05, 1.05);
  const ey = lerp(8, 12, o), cu = lerp(17.33, 3.12, o), cl = lerp(17.33, 20.88, o);
  const up = `M2 ${ey.toFixed(3)}C6.4 ${cu.toFixed(3)} 17.6 ${cu.toFixed(3)} 22 ${ey.toFixed(3)}`;
  const lo = `M2 ${ey.toFixed(3)}C6.4 ${cl.toFixed(3)} 17.6 ${cl.toFixed(3)} 22 ${ey.toFixed(3)}`;
  E.up.setAttribute('d', up); E.lo.setAttribute('d', lo);
  E.clip.setAttribute('d', `${up}C17.6 ${cl.toFixed(3)} 6.4 ${cl.toFixed(3)} 2 ${ey.toFixed(3)}Z`);
  E.pupil.style.opacity = smooth((o - 0.2) / 0.5).toFixed(3);
  const k = smooth((0.5 - o) / 0.4);
  for (const { l: [x0, y0, x1, y1], e } of E.lashes) {
    e.setAttribute('d', `M${lerp(x1, x0, k).toFixed(3)} ${lerp(y1, y0, k).toFixed(3)}L${x1} ${y1}`);
    e.style.opacity = k.toFixed(3);
  }
}

function promo(parent, ox, oy) {

  const gr = sv('linearGradient', { id: id + 'g', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  sv('stop', { offset: 0, 'stop-color': K.promoLine, 'stop-opacity': 0.16 }, gr);
  sv('stop', { offset: 1, 'stop-color': K.promoLine, 'stop-opacity': 0 }, gr);
  const layer = sv('g', { 'clip-path': `url(#${id}c)` }, g);
  P.strings = STRINGS.map(s => ({

    dots: dashXs(sampleBez(s.d), 80, SX0, SX1 + 4).map(x => ({ x, e: sv('circle', { r: 2, fill: K.promoLine }, layer) })),
  }));
  P.big = sv('circle', { r: 5.03, fill: K.promoDot }, layer);

}
function drawStrings(P, t, plucks) {
  const off = (s, x) => {
    let y = 0;
    const shape = Math.sin(Math.PI * clamp((x - SX0) / (SX1 - SX0)));
    for (const p of plucks) {
      if (p.s !== s) continue;
      for (const tp of [p.t, p.t - LOOP]) {
        const tau = t - tp;
        if (tau < -0.08 || tau > 2.5) continue;
        y += tau < 0 ? 9 * smooth((tau + 0.08) / 0.08) * shape
                     : 9 * Math.cos(2 * Math.PI * STRINGS[s].f * tau) * Math.exp(-tau / 0.34) * shape;
      }
    }
    return y;
  };
  STRINGS.forEach((s, i) => {
    const pts = [];
    for (let x = 60; x <= 232; x += 4) pts.push([x, yAt(s.samples, x) + off(i, x)]);
    const d = smoothPath(pts);
    P.strings[i].line.setAttribute('d', d);
    P.strings[i].fill.setAttribute('d', `${d}L232 87L60 87Z`);          // the fade ends where the clip does
    for (const dot of P.strings[i].dots) { dot.e.setAttribute('cx', dot.x.toFixed(2)); dot.e.setAttribute('cy', (yAt(s.samples, dot.x) + off(i, dot.x)).toFixed(2)); }
  });
  P.big.setAttribute('cx', 169.03); P.big.setAttribute('cy', (33.03 + off(1, 169.03)).toFixed(2));
}

  const c = document.getElementById('cursor');
  c.innerHTML = '<defs><filter id="cs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity=".38"/></filter></defs>' +
    '<g filter="url(#cs)" transform="translate(4 3) scale(1.95)"><path d="M1 1v16.2l3.9-3.7 2.5 5.7 2.6-1.1-2.4-5.6h5.5Z" fill="#000" stroke="#fff" stroke-width="1.15" stroke-linejoin="round"/></g>';
  D.cursor = c;
}

/* ==========================================================================================================
   seek(t): the frame at loop time t, computed from nothing but t
   ========================================================================================================== */
function eqAt(t, band) {
  const f = ((t % LOOP) + LOOP) % LOOP * DATA.eq.rate, i = Math.floor(f), k = f - i;
  const a = EQ[(i % EQ_FRAMES) * EQ_BANDS + band], b = EQ[((i + 1) % EQ_FRAMES) * EQ_BANDS + band];
  return lerp(a, b, k) / 255;
}
function bandAt(x) {                          // fractional tenor index for an x on the chart
  if (x <= TEN[0]) return 0;
  if (x >= TEN[8]) return 8;
  let k = 0; while (TEN[k + 1] < x) k++;
  return k + (x - TEN[k]) / (TEN[k + 1] - TEN[k]);
}
const BAND_X = []; for (let x = 44; x <= 800; x += 7) BAND_X.push(x);
const EQ_H = 18;                              // how far (world px) a full-scale band lifts its stretch of curve
function spline(v, u) {                       // Catmull-Rom through per-band values at a fractional band index
  const i = Math.min(v.length - 2, Math.floor(u)), f = u - i;
  const p0 = v[Math.max(0, i - 1)], p1 = v[i], p2 = v[i + 1], p3 = v[Math.min(v.length - 1, i + 2)];
  return 0.5 * (2 * p1 + (p2 - p0) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (3 * p1 - p0 - 3 * p2 + p3) * f * f * f);
}

function seek(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const z = Math.exp(TL.lz(t)), cx = TL.cx(t), cy = TL.cy(t);
  ZOOM = z;
  document.getElementById('world').style.transform = `translate(${px(800 - cx * z)},${px(600 - cy * z)}) scale(${z.toFixed(5)})`;

  // the one shape
  const x0 = TL.x0(t), x1 = TL.x1(t), y0 = TL.y0(t), y1 = TL.y1(t), r = Math.max(0, TL.r(t));
  const fill = TL.fill(t), strokeC = TL.stroke(t), glow = TL.glow(t);
  for (const e of [D.shape, D.stroke]) Object.assign(e.style, { left: px(x0), top: px(y0), width: px(x1 - x0), height: px(y1 - y0), borderRadius: px(r) });
  D.shape.style.background = rgba(fill);
  D.stroke.style.borderColor = rgba(strokeC);
  D.inner.style.transform = `translate(${px(-x0)},${px(-y0)})`;
  if (glow > 0.003) {
    Object.assign(D.glow.style, { visibility: 'visible', left: px(x0 - 4), top: px(y0 - 4), width: px(x1 - x0 + 8), height: px(y1 - y0 + 8),
      borderRadius: px(r + 4), background: rgba([fill[0], fill[1], fill[2], 1]), opacity: (glow * clamp(fill[3])).toFixed(3) });
  } else D.glow.style.visibility = 'hidden';

  // button + promo button + icon button
  const ink = rgba(TL.eyeInk(t));
  [[D.eyes[0], TL.eL], [D.eyes[1], TL.eR]].forEach(([E, c]) => {
    if (!show(E.s, c.v(t))) return;
    const s = c.s(t), x = c.x(t);
    Object.assign(E.s.style, { left: px(x - s / 2), top: px(-s / 2), width: px(s), height: px(s), color: ink });
    E.s.setAttribute('width', s); E.s.setAttribute('height', s);
    drawEye(E, c.o(t));
  });
  if (show(D.tBtn, TL.tBtn(t))) D.tBtn.style.color = ink;
  if (show(D.tPromo, TL.tPromo(t))) {
    const k = lerp(12 / 18, 1, clamp((x1 - x0 - 119) / (238 - 119)));            // the label grows with the pill, never past it
    Object.assign(D.tPromo.style, { color: ink, transform: `translateX(calc(-50% + ${px(TL.tPromoX(t))})) scale(${k.toFixed(4)})` });
  }
  if (show(D.loader, TL.loader(t))) D.loader.style.transform = `rotate(${TL.loaderRot(t).toFixed(3)}deg)`;

  // input
  show(D.input, TL.input(t));
  show(D.subErr, TL.subErr(t));
  show(D.subOk, TL.subOk(t));

  // promo (stand-alone)
  if (show(D.promo.root, TL.promo(t))) drawStrings(D.promo, t, PLUCKS.solo);

  // widget
  const wOn = show(D.head, TL.wHead(t));
  const cOn = show(D.chart, TL.wChart(t));
  show(D.legend, TL.wChart(t));
  if (wOn) {
    [[D.fPeriod, TL.fPeriod], [D.fCurrency, TL.fCurrency], [D.fType, TL.fType]].forEach(([F, c]) => {
      show(F.ph, c.ph(t)); show(F.val, c.val(t)); F.root.style.borderColor = rgba(c.st(t));
    });
    show(D.fCurve.ph, TL.fCurve.ph0(t)); show(D.fCurve.ph1, TL.fCurve.ph1(t)); show(D.fCurve.ph2, TL.fCurve.ph2(t));
    D.fCurve.root.style.borderColor = rgba(TL.fCurve.st(t));
  }
  if (show(D.empty, TL.empty(t))) {
    D.select.style.color = rgba(TL.selectInk(t));
    D.select.style.borderColor = rgba(TL.selectStroke(t));
  }
  [[D.mPeriod, TL.menuPeriod, 0], [D.mCurrency, TL.menuCurrency, 1], [D.mType, TL.menuType, 2]].forEach(([M, c, i]) => {
    const v = c(t);
    if (show(M.root, v, 6)) { M.root.style.transform = `translateY(${px((1 - v) * -6)})`; show(M.pick, TL.pick[i](t), 4); }
  });
  const dv = TL.dropdown(t);
  if (show(D.drop, dv, 6)) {
    D.drop.style.transform = `translateY(${px((1 - dv) * -6)})`;
    D.cbs.forEach((cb, i) => {
      const k = clamp(TL.check[i](t));
      cb.fillBox.style.opacity = k.toFixed(3);
      cb.mark.setAttribute('stroke-dashoffset', (11 * (1 - smooth((k - 0.2) / 0.8))).toFixed(3));
    });
  }

  // legend + chart
  const lh = TL.legendH(t);
  D.chips.forEach((c, i) => show(c, TL.chip[i](t), 8));
  if (cOn) drawChart(t, lh);

  // the card: promo in the list → modal → toast
  const C = TL.card;
  const cardOn = show(D.card, C.on(t));
  show(D.cardStroke, C.on(t));
  if (cardOn) {
    const a0 = C.x0(t), b0 = C.y0(t), a1 = C.x1(t), b1 = C.y1(t), cr = C.r(t), sh = clamp(C.shadow(t));
    for (const e of [D.card, D.cardStroke]) Object.assign(e.style, { left: px(a0), top: px(b0), width: px(a1 - a0), height: px(b1 - b0), borderRadius: px(cr) });
    D.card.style.background = rgba(C.fill(t));
    D.card.style.boxShadow = sh > 0.003 ? `0 4px 4px rgba(0,0,0,${(0.3 * sh).toFixed(3)}), 0 8px 12px 6px rgba(0,0,0,${(0.15 * sh).toFixed(3)})` : 'none';
    D.cardStroke.style.borderColor = rgba(C.stroke(t));
    D.cardIn.style.transform = `translate(${px(-a0)},${px(-b0)})`;
    if (show(D.cardPromo.root, C.promo(t))) {
      drawStrings(D.cardPromo, t, PLUCKS.card);
      D.cardPromo.cta.style.background = rgba(TL.tryFill(t));
    }
    D.modal.forEach((m, i) => show(m, C.modal[i](t)));
    D.start.style.background = rgba(TL.startFill(t));
    show(D.toast, C.toast(t));
  }

  // cursor (screen space; size breathes a little with the zoom, the tip is the hot spot)
  const wx = TL.curX(t), wy = TL.curY(t), cs = TL.curS(t) * Math.pow(z / 2.4, 0.22);
  const sx = 800 + (wx - cx) * z, sy = 600 + (wy - cy) * z;
  D.cursor.style.transform = `translate(${px(sx - 5.95 * cs)},${px(sy - 4.95 * cs)}) scale(${cs.toFixed(4)})`;
  D.cursor.style.transformOrigin = '0 0';
}

function drawChart(t, lh) {
  const top = 88 + lh, H = 444 - lh, bh = (H - 16) / 7;
  D.chart.style.top = px(top);
  D.chart.style.height = px(476 - lh);
  D.plotClip.setAttribute('height', H.toFixed(3));
  for (let k = 0; k < 7; k++) {
    const yt = 6 + (k + 1) * bh - 14;
    D.yLab[k][0].style.top = px(yt); D.yLab[k][1].style.top = px(yt);
    D.hGrid[k].setAttribute('y1', (yt + 7).toFixed(3)); D.hGrid[k].setAttribute('y2', (yt + 7).toFixed(3));
  }
  D.vGrid.forEach(l => l.setAttribute('y2', H.toFixed(3)));
  D.xLab.forEach(l => { l.style.top = px(H + 9); });
  const map = y => (bh - 1) + (y - 55.571) * bh / 56.571;          // Figma's 412-tall plot → this one
  const eqNow = []; for (let k = 0; k < 9; k++) eqNow.push(eqAt(t, k));
  CURVES.forEach((c, i) => {
    const S = TL.curve[i], G = D.curves[i];
    const on = S.on(t);
    if (on < 0.003) { G.grp.style.visibility = 'hidden'; if (G.fill) G.fill.style.visibility = 'hidden'; return; }
    G.grp.style.visibility = 'visible'; G.grp.style.opacity = on.toFixed(3);
    const rise = S.rise.map(f => f(t)), amp = S.amp(t);
    const yOf = x => {
      const u = bandAt(x), rv = spline(rise, u), ev = spline(eqNow, u);
      return lerp(H, map(yAt(c.samples, x)), rv) - amp * ev * EQ_H * clamp(rv);
    };
    const P = BAND_X.map(x => [x, yOf(x)]);
    const d = smoothPath(P);
    G.line.setAttribute('d', d);
    if (G.fill) {
      G.fill.style.visibility = 'visible'; G.fill.style.opacity = on.toFixed(3);
      G.fill.setAttribute('d', `${d}L${P[P.length - 1][0]} ${H + 40}L${P[0][0]} ${H + 40}Z`);
    }
    for (const dot of G.dots) { dot.e.setAttribute('cx', dot.x.toFixed(2)); dot.e.setAttribute('cy', yOf(dot.x).toFixed(2)); }
  });
}

/* ---------- boot ---------- */
async function boot() {
  await Promise.all(['400 12px Inter', '500 12px Inter', '600 12px Inter'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  build();
  window.seek = seek;
  window.CUES = CUES.sort((a, b) => a.t - b.t);
  window.LOOP = LOOP;
  window.BEAT = BEAT;
  seek(Number(Q.get('t') || 0));
  window.READY = true;
  if (!RENDER) preview();
}
function preview() {                          // fit the 1600×1200 plate to the window; play with the mixed audio if it is there
  const frame = document.getElementById('frame'), bar = document.getElementById('bar');
  const fit = () => { const s = Math.min(innerWidth / 1600, (innerHeight - 64) / 1200); frame.style.transform = `translate(${(innerWidth - 1600 * s) / 2}px, 8px) scale(${s})`; };
  addEventListener('resize', fit); fit();
  bar.hidden = false;
  const audio = document.getElementById('audio'), play = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  audio.src = 'renders/ds-promo-audio.m4a';
  let playing = false, t0 = 0, start = 0, hasAudio = false;
  audio.addEventListener('canplay', () => { hasAudio = true; }, { once: true });
  const now = () => hasAudio ? audio.currentTime : t0 + (performance.now() - start) / 1000;
  const tick = () => { if (!playing) return; const t = now() % LOOP; seek(t); scrub.value = t / LOOP; clock.value = t.toFixed(2); requestAnimationFrame(tick); };
  play.onclick = () => {
    playing = !playing; play.textContent = playing ? 'Pause' : 'Play';
    if (playing) { t0 = scrub.value * LOOP; start = performance.now(); if (hasAudio) { audio.currentTime = t0; audio.play(); } tick(); }
    else if (hasAudio) audio.pause();
  };
  scrub.oninput = () => { const t = scrub.value * LOOP; seek(t); clock.value = t.toFixed(2); if (hasAudio) audio.currentTime = t; t0 = t; start = performance.now(); };
  document.getElementById('theme').onclick = () => { const q = new URLSearchParams(location.search); q.set('theme', THEME === 'dark' ? 'light' : 'dark'); location.search = q; };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); play.onclick(); } });
}
boot();
</script>
