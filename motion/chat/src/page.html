<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>From desk to pocket · chat promo</title>
<style>
  /* Stage: 1600×1200, the 4:3 plate of the site's cases. Nothing moves by itself: every value is written by seek(t). */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; background: #000; font-family: Inter, system-ui, sans-serif; font-synthesis: none; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; left: 0; top: 0; width: 1600px; height: 1200px; overflow: hidden; transform-origin: 0 0; background: #000; }
  #gl { position: absolute; left: 0; top: 0; width: 1600px; height: 1200px; display: block; }
  #headline { position: absolute; left: 0; top: 0; width: 1600px; height: 1200px; pointer-events: none; }
  #headline .w { position: absolute; left: 0; top: 0; white-space: pre; font: 700 68px/80px Inter, sans-serif; letter-spacing: -0.02em; color: #f0f0f0; will-change: auto; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; z-index: 5;
         padding: 6px 8px; border-radius: 10px; background: #202020; color: #f0f0f0; font: 500 12px/16px Inter, sans-serif; }
  #bar[hidden] { display: none; }
  #bar button { font: inherit; color: inherit; background: #303030; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #bar input { width: 420px; accent-color: #5041ff; }
  #bar output { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
<style id="fonts">
/*FONTS*/
</style>
</head>
<body>
<div id="frame"><canvas id="gl" width="1600" height="1200"></canvas><div id="headline"></div></div>
<div id="bar" hidden><button id="play">Play</button><input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" /><output id="clock">0.00</output></div>
<audio id="audio" preload="auto"></audio>
<script type="application/json" id="beats">/*BEATS*/</script>
<script type="application/json" id="assets">/*ASSETS*/</script>
<script>
/*BUNDLE*/
</script>
</body>
</html>
