/* ═══ Helpers ═══ */
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const NS = 'http://www.w3.org/2000/svg';
const pd = pts => 'M' + pts.map(p => p[0].toFixed(3) + ' ' + p[1].toFixed(3)).join('L');
function rect(cx, cy, w, h, rad) { return { cx, cy, w, h, rad, l: cx - w / 2, t: cy - h / 2, r: cx + w / 2, b: cy + h / 2 }; }
const rectTL = (l, t, w, h, rad) => rect(l + w / 2, t + h / 2, w, h, rad);

/* ═══ The opener's glyph: eye → plus, in 24-unit Lucide space (stroke 2 → 1.333 px at 16), as in the atoms loop ═══ */
function ribbon(px, py, phi, k, len, n) {               // an arc of curvature k and length len, centred on (px,py), tangent phi
  const tx = Math.cos(phi), ty = Math.sin(phi), nx = Math.sin(phi), ny = -Math.cos(phi), out = [];
  for (let i = 0; i < n; i++) {
    const s = -len / 2 + len * i / (n - 1), ks = k * s;
    let a, b;
    if (Math.abs(ks) < 1e-5) { a = s; b = k * s * s / 2; } else { a = Math.sin(ks) / k; b = (1 - Math.cos(ks)) / k; }
    out.push([px + tx * a + nx * b, py + ty * a + ny * b]);
  }
  return out;
}
function lidArc(hw, cy, sag, n = 40) {                   // an arc through (12−hw, cy), (12+hw, cy) whose midpoint is (12, cy+sag)
  const as = Math.abs(sag);
  if (as < 1e-4) return ribbon(12, cy, 0, 0, 2 * hw, n);
  const R = (hw * hw + sag * sag) / (2 * as), half = Math.asin(Math.min(1, hw / R));
  return ribbon(12, cy + sag, 0, (sag > 0 ? 1 : -1) / R, 2 * R * half, n);
}
// Lucide eye (open): two r=10.75 arcs on y=12. Lucide eye-closed: one r=10.645 arc from (2,8) to (22,8) + 4 lashes.
// Lucide plus: M5 12h14 + M12 5v14 — the shut lid flattens into its bar, then its stem grows.
const OPEN_SAG = 6.656, SHUT_SAG = 6.996;
const LASHES = [[5.726, -1.726, 2.05], [9.722, -0.722, 3.25], [14.278, 0.722, 3.25], [18.274, 1.726, 2.05]];
function lashesOn(lid, fx, fy) {                         // lash roots sit on the lid; fx, fy scale the Lucide lash
  const out = [];
  if (Math.max(Math.abs(fx), Math.abs(fy)) <= 0.02) return out;
  for (const [x, dx, dy] of LASHES) {
    for (let i = 1; i < lid.length; i++) {
      const a = lid[i - 1], b = lid[i];
      if ((a[0] - x) * (b[0] - x) <= 0 && a[0] !== b[0]) {
        const y = lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0]));
        out.push([[x, y], [x + dx * fx, y + dy * fy]]); break;
      }
    }
  }
  return out;
}
// o: open (1) → shut (0); f: the shut lid → the plus's bar; v: the stem; k: lashes (on the upper lid, up when open)
function glyphGeom(o, f, v, k, px, py) {
  const hw = lerp(lerp(10, 7, f), 10, o), cy = lerp(lerp(8, 12, f), 12, o), shut = SHUT_SAG * (1 - f), s = 1 - 2 * o;
  const up = lidArc(hw, cy, lerp(shut, -OPEN_SAG, o)), lo = lidArc(hw, cy, lerp(shut, OPEN_SAG, o));
  return { up, lo, lashes: lashesOn(up, Math.abs(s) * k, s * k), pupil: [12 + px, 12 + py], stem: v };
}

/* ═══ Timeline ═══ */
function timeline() {
  const R = L.R;
  const T = (name, v) => (TR[name] = new Track(v));
  const CT = (name, tok) => (TR[name] = new CTrack(tok));
  const inOut = (name, pairs, s0 = SP.in, s1 = SP.out) => {      // [[tIn, tOut], …] → an opacity track
    const tr = T(name, 0);
    for (const [a, b] of pairs) { tr.to(a, 1, s0); if (b != null) tr.to(b, 0, s1); }
    return tr;
  };

  // ── the shape: New Button "New Atoms" → Icon only (the +) → the widget → back into the + → "New Atoms"
  const keys = ['cx', 'cy', 'w', 'h', 'rad'];
  keys.forEach(k => T(k, R.na[k]));
  const shapeTo = (t, St, s = SP.geom) => keys.forEach(k => TR[k].to(t, St[k], s));
  shapeTo(B(4), R.prim, SP.collapse);                               // the label goes, the button closes onto its icon
  shapeTo(B(6), R.wid, SP.wide);                                    // the + opens the empty widget around itself
  shapeTo(B(31), R.prim, SP.collapse);                              // the table folds back into the +
  shapeTo(B(1) + 0.2, R.na, SP.snap);                                // … which dissolves on the stop; unseen, it is "New Atoms" again

  // the button's variant, one click each: Unfilled (no surface) → Outline (1 px inside) → Primary (filled)
  T('fillA', 0).to(B(3), 1, SP.col).to(B(1) + 0.2, 0, SP.snap);
  CT('fill', 'Button/Fill/Primary/Default');
  // (the swaps at B6 and B31 + 0.5 happen under the + button's own surface, so the widget never flashes purple)
  TR.fill.to(B(6), 'Background/Level1', SP.snap).to(B(31) + 0.5, 'Button/Fill/Primary/Default', SP.snap);
  CT('stroke', 'Button/Stroke/Outline/Default');
  T('strokeA', 0).to(B(2), 1, SP.col).to(B(3), 0, SP.col);
  CT('ink', 'Button/Icon/Unfilled/Default');
  TR.ink.to(B(2), 'Button/Icon/Outline/Default').to(B(3), 'Button/Icon/Primary/Default').to(B(1) + 0.2, 'Button/Icon/Unfilled/Default', SP.snap);
  CT('naInk', 'Button/Text/Unfilled/Default');
  TR.naInk.to(B(2), 'Button/Text/Outline/Default').to(B(3), 'Button/Text/Primary/Default').to(B(1) + 0.2, 'Button/Text/Unfilled/Default', SP.snap);
  inOut('naT', [[B(1) + 0.2, B(4)]], SP.snap, spring(0.16, 1));
  const press = T('press', 0);
  for (const b of [2, 3, 4]) press.to(B(b), 0.06, SP.press).to(B(b) + 0.085, 0, SP.release);

  // the glyph: the eye (lashes up) closes, its lid flattens into the plus's bar and the stem grows; reset unseen after the stop
  T('eyeO', 1).to(B(5), 0, spring(0.2, 1)).to(B(1) + 0.2, 1, SP.snap);
  T('lashK', 1).to(B(5), 0, spring(0.12, 1)).to(B(1) + 0.2, 1, SP.snap);
  T('eyeF', 0).to(B(5) + 0.1, 1, spring(0.3, 1)).to(B(1) + 0.2, 0, SP.snap);
  T('plusV', 0).to(B(5) + 0.22, 1, spring(0.3, 0.88)).to(B(1) + 0.2, 0, SP.snap);

  // ── camera: frames each state; zoom-outs move with the shape, zoom-ins lag
  const cam = (F, fw = 0.62, fh = 0.44, cap = 7) => [F.cx, F.cy, Math.log(Math.min(cap, fw * W / F.w, fh * H / F.h))];
  // the opener sits under the headline: framed at ×6.5, the button's centre TY.hlDrop px below the frame's
  const low = c => [c[0], c[1] - TY.hlDrop / Math.exp(c[2]), c[2]];
  const cNa = low(cam(R.na, 0.62, 0.44, 6.5)), cPrim = low(cam(R.prim, 0.62, 0.44, 6.5)), cWid = cam(R.wid, 0.8, 0.86);
  T('camX', cNa[0]); T('camY', cNa[1]); T('camS', cNa[2]);
  const camTo = (t, c, s = SP.cam) => { TR.camX.to(t, c[0], s); TR.camY.to(t, c[1], s); TR.camS.to(t, c[2], s); };
  camTo(B(4), cPrim, SP.camPan);                                   // follow the button onto its icon
  camTo(B(6), cWid, SP.camOut);                                    // the widget opens and fills the frame
  camTo(B(7), cam(rectTL(0, 0, 568, 352), 0.94, 0.9), SP.camIn);   // lean onto its top half as the content lands there
  camTo(B(13) - 0.3, cam(R.drop, 0.8, 0.8, 3.4), spring(0.7, 1));  // lean in as the cursor reaches the Primary button
  camTo(B(17), cWid, SP.camOut);                                   // Try Pro: back out to watch the groups unfold
  camTo(B(19), cam(R.badgeCam, 0.62, 0.44, 5.5), spring(0.7, 1));  // push in on the header: the PRO badge appears after the link
  camTo(B(21), cWid, SP.camOut);
  camTo(B(31), cPrim, SP.camIn);
  camTo(B(1) + 0.2, cNa, SP.snap);                                 // reframed unseen, between the + and the opener

  // ── the + button inside the header: the shape is its surface until the widget opens (B6) and after the fold (B31)
  T('primBg', 0).to(B(6), 1, SP.snap).to(B(31) + 0.5, 0, SP.snap);
  inOut('primHov', [[B(13) - 0.05, B(14) + 0.4]], SP.hover, spring(0.12, 1));
  T('primPress', 0).to(B(6), 1, SP.press).to(B(6) + 0.1, 0, SP.release).to(B(14), 1, SP.press).to(B(14) + 0.1, 0, SP.release);

  // ── the empty widget fills: title · chevron · link (B7), the actions right to left (B8), the tabs (B9),
  // a click on All (B10), the header row (B11), the two groups (B12)
  inOut('title', [[B(7) + 0.02, B(31)]]);
  inOut('chev', [[B(7) + 0.1, B(31)]]);
  inOut('link', [[B(7) + 0.18, B(31)]]);
  L.actIn = { 5: B(8), 4: B(8) + 0.1, 3: B(8) + 0.2, 2: B(8) + 0.3, 1: B(8) + 0.4 };
  for (let k = 1; k < 6; k++) inOut('act' + k, [[L.actIn[k], B(31)]]);
  inOut('badge', [[B(20), B(31)]], spring(0.3, 1));
  T('badgeSc', 0.7).to(B(20), 1, spring(0.34, 0.9)).to(B(32), 0.7, SP.snap);

  // tabs: the bar lands left to right with Stocks active and its divider drawn across; the click moves it to All
  L.tabIn = k => B(9) + 0.1 * k;
  for (let k = 0; k < 5; k++) inOut('tab' + k, [[L.tabIn(k), B(31)]]);
  inOut('ind', [[L.tabIn(2) + 0.04, B(31)]]);
  T('indX', L.tabX[2]).to(B(10), L.tabX[0], SP.slide).to(B(32), L.tabX[2], SP.snap);
  T('indW', M.tabs[2]).to(B(10), M.tabs[0], SP.slide).to(B(32), M.tabs[2], SP.snap);
  T('sel2', 1).to(B(10), 0, spring(0.16, 1)).to(B(32), 1, SP.snap);
  T('hov2', 0);
  T('hov0', 0).to(B(10) - 0.12, 1, SP.hover).to(B(10), 0, spring(0.16, 1));
  inOut('tdiv', [[B(9), B(31)]]);
  T('tdivW', 0).to(B(9), 536, SP.wide).to(B(32), 0, SP.snap);

  // header row and its checkbox: land left to right on 32nds at B11; the box is indeterminate while rows are selected
  inOut('hcBox', [[B(11), B(31) + 0.12]]);
  T('hcFill', 0).to(B(23), 1, spring(0.1, 1)).to(B(30) + 0.06, 0, spring(0.12, 1));
  inOut('hcMark', [[B(23), B(30) + 0.06]], SP.snap);
  T('hcDraw', 1); T('hcDash', 1);
  for (let k = 0; k < 5; k++) inOut('ht' + k, [[B(11) + 0.1 * (k + 1), B(31) + 0.02 * (k + 1)]]);
  inOut('hdiv', [[B(11), B(31)]]);

  // group rows: Stocks (B12) and Currency (an 8th later) land collapsed and unfold after Try Pro
  const g0 = B(12), g1 = B(12) + 0.4;
  for (const n of ['g0chev', 'g0text', 'g0fill', 'g0div']) inOut(n, [[g0, B(31) + 0.02]]);
  T('g0divW', 536);
  T('g0dy', 10).to(g0, 0, SP.row).to(B(32), 10, SP.snap);
  T('g0rot', 180).to(B(17) + 0.04, 0, spring(0.3, 0.92)).to(B(32), 180, SP.snap);      // chevron: collapsed ▾ → expanded ▴
  for (const n of ['g1chev', 'g1text', 'g1fill', 'g1div']) inOut(n, [[g1, B(31) + 0.2]]);
  T('g1dy', 10).to(g1, 0, SP.row).to(B(32), 10, SP.snap);
  T('g1rot', 180).to(B(18) + 0.04, 0, spring(0.3, 0.92)).to(B(32), 180, SP.snap);

  // ── rows: they unfold under their group on 64ths (Stocks a 16th after the Try Pro click, Currency a beat later), retract on the fold
  ROWS.forEach((row, r) => {
    const A = r < NSTOCK ? B(17) + 0.2 + 0.045 * r : B(18) + 0.1 + 0.06 * (r - NSTOCK), E = B(31) + 0.012 * r;
    T('ra' + r, 0).to(A, 1, spring(0.26, 1)).to(E, 0, spring(0.14, 1));
    T('rdy' + r, -10).to(A, 0, SP.row).to(E, -14, spring(0.3, 1)).to(B(32), -10, SP.snap);
    T('rh' + r, 0); T('rs' + r, 0); T('rd' + r, 0);
    row.appear = A;
  });

  // ── curve-promo-drop1: opens from the Primary button, its curve draws itself, the cursor goes to Try Pro
  T('ddOp', 0).to(B(14) + 0.02, 1, spring(0.22, 1)).to(B(17) + 0.04, 0, spring(0.14, 1));
  T('ddSc', 0.94).to(B(14) + 0.02, 1, spring(0.3, 0.92)).to(B(17) + 0.04, 0.97, spring(0.14, 1)).to(B(18), 0.94, SP.snap);
  T('ddDy', -6).to(B(14) + 0.02, 0, spring(0.3, 0.92)).to(B(18), -6, SP.snap);
  T('curveDraw', 0).to(B(15), 1, spring(0.7, 1)).to(B(18), 0, SP.snap);
  T('curveDots', 0).to(B(15) + 0.3, 1, spring(0.3, 0.9)).to(B(18), 0, SP.snap);
  inOut('ctaHov', [[B(16) - 0.06, B(17) + 0.2]], SP.hover, spring(0.12, 1));
  T('ctaPress', 0).to(B(17), 1, SP.press).to(B(17) + 0.1, 0, SP.release);

  // ── action panel: it only appears at the end, as the toast that rises with the first selection
  T('apDy', 70).to(B(23) + 0.02, 0, spring(0.44, 0.92)).to(B(30) + 0.1, 70, spring(0.36, 1));
  T('apBg', 0).to(B(22), 1, SP.snap).to(B(32), 0, SP.snap);
  inOut('apInfo', [[B(22), B(31) + 0.4]], SP.snap, SP.snap);
  const val = [[[B(23), B(25)]], [[B(25), B(26)]], [[B(26), B(27)]], [[B(27), B(29)]], [[B(29) + 0.04, B(31) + 0.4]]];
  val.forEach((seg, i) => {
    const tr = T('v' + i, 0), dy = T('vdy' + i, 8);
    for (const [p, q] of seg) { tr.to(p, 1, SP.in).to(q, 0, SP.out); dy.to(p, 0, SP.in).to(q, -8, SP.out).to(q + 0.3, 8, SP.snap); }
  });
  for (const n of ['fav', 'add', 'x']) inOut(n, [[B(22), B(31) + 0.4]], SP.snap, SP.snap);
  T('favDx', 0); T('addDx', 0); T('xDx', 0);
  T('favHov', 0);
  inOut('addHov', [[B(29) - 0.12, B(29) + 0.45]], SP.hover, spring(0.12, 1));
  inOut('xHov', [[B(30) - 0.12, B(30) + 0.3]], SP.hover, spring(0.12, 1));
  T('addPress', 0).to(B(29), 1, SP.press).to(B(29) + 0.1, 0, SP.release);
  T('xPress', 0).to(B(30), 1, SP.press).to(B(30) + 0.1, 0, SP.release);

  // ── cursor (world space). A key is the moment a move starts; hovers land on the beat, clicks press on it.
  const rowBox = r => [32, rowY(r) + 13];
  const P = {
    na: [L.naX + M.na * 0.42, L.prim.y + 17],                  // on the label: it stays put while the button closes
    eye: [L.iconX(0) + 13, L.prim.y + 22],                    // the button's centre, just clear of the glyph: the pupil centres
    badge: [L.badge.x + L.badge.w + 20, 30],                  // beside the PRO badge's slot, in frame for the close-up
    prim: [L.prim.x + 17, L.prim.y + 17], rest0: [L.prim.x + 76, L.prim.y + 62], wRest: [300, 240],
    all: [L.tabX[0] + M.tabs[0] * 0.6, 59], tabRest: [L.tabX[4] + M.tabs[4] + 40, 96],
    fav: [L.ap.l + L.apFav.x + L.apFav.w * 0.5, L.ap.t + L.apBy + 14],
    add: [L.ap.l + L.apAdd.x + L.apAdd.w * 0.55, L.ap.t + L.apBy + 14],
    x: [L.ap.l + L.apX.x + 13, L.ap.t + L.apBy + 13],
    cta: [L.cta.x + L.cta.w * 0.45, L.cta.y + 13],
  };
  T('curX', P.x[0]); T('curY', P.x[1]);
  const move = (t, p, s = SP.cursor) => { TR.curX.to(t, p[0], s); TR.curY.to(t, p[1], s); };
  const arrive = (beat, p, s = SP.cursor) => move(B(beat) - 0.42, p, s);
  move(B(30) + 0.3, P.rest0, SP.cursorLong);                // straight after ×, ahead of the camera's zoom onto the +
  arrive(2, P.na);                                           // three clicks on the label, then it waits beside the icon
  move(B(4) + 0.3, P.eye, SP.cursorLong);                   // onto the button: the eye looks straight at it, then the +
  move(B(6) + 0.3, P.wRest, SP.cursorLong);
  arrive(10, P.all); move(B(10) + 0.4, P.tabRest);
  move(B(12) - 0.1, P.prim, SP.cursorLong);
  arrive(16, P.cta);
  move(B(18) + 0.2, P.badge, SP.cursorLong);                // up to the header, where the PRO badge lands
  move(B(21) + 0.1, rowBox(1), SP.cursorLong);
  arrive(24, rowBox(3));
  move(B(25) + 0.12, rowBox(4), spring(0.5, 0.97));          // the drag
  move(B(26) + 0.18, rowBox(17), SP.cursorLong);
  move(B(28) + 0.2, P.add, SP.cursorLong); move(B(29) + 0.34, P.x);   // from the row straight to Add
  T('curP', 0);
  L.clicks = [2, 3, 4, 6, 10, 14, 17, 23, 27, 29, 30];
  for (const b of L.clicks) TR.curP.to(B(b), 1, SP.press).to(B(b) + 0.085, 0, SP.release);
  L.tGrab = B(25); L.tRel = B(26);
  TR.curP.to(L.tGrab, 1, SP.press).to(L.tRel, 0, SP.release);

  // ── hover and selection, driven by the cursor
  const boundary = rowY(4);                                  // the drag crosses from row 3 into row 4 here
  for (let t = L.tGrab; t < L.tRel; t += 0.001) if (TR.curY.at(t) >= boundary) { L.tCross = t; break; }
  TR.rh1.to(B(22), 1, SP.hover).to(B(24) - 0.42, 0, SP.hover);
  TR.rh3.to(B(24), 1, SP.hover).to(L.tCross, 0, SP.hover);
  TR.rh4.to(L.tCross, 1, SP.hover).to(B(26) + 0.25, 0, SP.hover);
  TR.rh17.to(B(27) - 0.04, 1, SP.hover).to(B(28) - 0.42, 0, SP.hover);
  const picks = [[1, B(23)], [3, B(25)], [4, L.tCross], [17, B(27)]];
  picks.forEach(([r, t], i) => {
    TR['rs' + r].to(t, 1, spring(0.1, 1)).to(B(30) + 0.05 * i, 0, spring(0.16, 1));
    TR['rd' + r].to(t + 0.02, 1, SP.draw).to(B(31), 0, SP.snap);
  });

  // ── the opening headline: word by word on 16ths from just after the stop, over the dissolving +, rising 18 px out of a blur; it leaves on the
  // press that opens the widget, fast and rising away, before the + swings up through its line as the camera pulls back
  L.HL0 = B(32) + 0.4;                                             // where the loop's line starts; the page starts here too
  L.hlIn = k => L.HL0 + 0.02 + 0.11 * k;
  // the opener waits for the headline: it grows in out of a blur once the last word has landed. On the stop the folded +
  // shrinks away into a blur (the stop's dot) as the words start again, so the loop hands over from the + to the line
  T('naA', 0).to(B(1) + 0.3, 1, spring(0.34, 1)).to(B(32) + 0.1, 0, spring(0.55, 1));
  HEADLINE.forEach((w, k) => {
    const tOut = B(6) - 0.04 + 0.006 * k;
    T('hl' + k, 0).to(L.hlIn(k), 1, SP.hlIn).to(tOut, 0, SP.hlOut);
    T('hldy' + k, 18).to(L.hlIn(k), 0, SP.hlRise).to(tOut, -30, SP.hlOut).to(tOut + 0.4, 18, SP.snap);
  });

  // ── UI sounds: the mixer puts each sound's measured peak on these times
  EVENTS = [];
  // every press sounds exactly like the button's click, the drag's press too; nothing is layered on a click, and what
  // a click causes sounds a 16th later (AFTER), clear of the click's release, which ends ≈ 0.15 s after the press
  const AFTER = 0.2;
  for (const b of L.clicks) EVENTS.push({ t: B(b), s: 'click' });
  EVENTS.push({ t: L.tGrab, s: 'click' });
  EVENTS.push({ t: B(5) + 0.22, s: 'dot' });                                     // the eye becomes the +
  EVENTS.push({ t: B(6) + AFTER, s: 'expand' });                                        // the widget opens out of the button
  for (let k = 0; k < 3; k++) EVENTS.push({ t: B(7) + 0.02 + 0.08 * k, s: 'tick' });
  for (let k = 1; k < 6; k++) EVENTS.push({ t: L.actIn[k], s: 'tick' });
  for (let k = 0; k < 5; k++) EVENTS.push({ t: L.tabIn(k), s: 'tick' });
  for (let k = 0; k < 6; k++) EVENTS.push({ t: B(11) + 0.1 * k, s: 'tick' });
  EVENTS.push({ t: g0, s: 'tick' }, { t: g1, s: 'tick' });
  EVENTS.push({ t: B(14) + AFTER, s: 'pop' }, { t: B(15) + 0.3, s: 'dot' });    // the dropdown opens; the curve's point lands
  EVENTS.push({ t: B(17) + AFTER, s: 'expand' }, { t: B(18) + 0.04, s: 'expand' });
  ROWS.forEach(row => EVENTS.push({ t: row.appear, s: 'row' }));
  EVENTS.push({ t: B(20), s: 'badge' });
  // (the chime swells 0.14 s to its peak, which is what the mixer places: its onset lands on the 16th like the others)
  EVENTS.push({ t: B(23) + AFTER, s: 'rise' }, { t: B(29) + AFTER + 0.14, s: 'success' }, { t: B(31), s: 'collapse' });
  EVENTS.push({ t: B(32), s: 'dot' });                                          // on the stop: the + dissolves
  EVENTS.sort((a, b) => a.t - b.t);
}

/* ═══ seek(t) — the only renderer ═══ */
let BLUR = 0;
function put(el, x, y, op, lab) {
  const s = el.style;
  if (op < 0.003) { if (s.visibility !== 'hidden') s.visibility = 'hidden'; return false; }
  s.visibility = 'visible';
  s.transform = `translate(${x.toFixed(3)}px,${y.toFixed(3)}px)`;
  s.opacity = Math.min(1, op).toFixed(4);
  s.filter = op > 0.997 ? 'none' : `blur(${((1 - Math.min(1, op)) * BLUR).toFixed(3)}px)`;
  if (lab) s.color = labCss(lab);
  return true;
}
function putI(el, x, y, op, lab, rot = 0, sc = 1) {      // a 16 px icon at its top-left
  const s = el.style;
  if (op < 0.003) { if (s.visibility !== 'hidden') s.visibility = 'hidden'; return false; }
  s.visibility = 'visible';
  s.transform = `translate(${x.toFixed(3)}px,${y.toFixed(3)}px)` + (sc !== 1 ? ` scale(${sc.toFixed(4)})` : '') + (rot ? ` rotate(${rot.toFixed(2)}deg)` : '');
  s.opacity = Math.min(1, op).toFixed(4);
  s.filter = op > 0.997 ? 'none' : `blur(${((1 - Math.min(1, op)) * BLUR).toFixed(3)}px)`;
  if (lab) s.color = labCss(lab);
  return true;
}
function box(el, x, y, w, h, lab, op, rad = 0) {
  const s = el.style;
  if (op < 0.003 || w <= 0) { if (s.visibility !== 'hidden') s.visibility = 'hidden'; return; }
  s.visibility = 'visible';
  s.transform = `translate(${x.toFixed(3)}px,${y.toFixed(3)}px)`;
  s.width = w.toFixed(3) + 'px'; s.height = h.toFixed(3) + 'px';
  s.background = labCss(lab, op);
  if (rad) s.borderRadius = rad + 'px';
}
// Checkbox control's mark (12 px frame at 2,2; vector "M8 0 L2.5 5.5 L0 3" at 2,3, 1.5 px), drawn from its short arm;
// Indeterminate folds the same three points onto one line
const CHECK = [[4, 8], [6.5, 10.5], [12, 5]], DASH = [[4, 8], [8, 8], [12, 8]];
function drawCB(E, x, y, o) {                            // o: op, fill (0..1), stroke colour, fill colour, mark op, draw, dash
  const s = E.el.style;
  // display, not visibility: a child with visibility:visible would still show inside a hidden parent
  if (o.op < 0.003) { if (s.display !== 'none') s.display = 'none'; return; }
  s.display = ''; s.visibility = 'visible';
  s.transform = `translate(${x.toFixed(3)}px,${y.toFixed(3)}px)`;
  s.opacity = Math.min(1, o.op).toFixed(4);
  s.filter = o.op > 0.997 ? 'none' : `blur(${((1 - Math.min(1, o.op)) * BLUR * 0.6).toFixed(3)}px)`;
  s.background = o.fill > 0.003 ? labCss(o.fillLab, o.fill) : 'transparent';
  s.boxShadow = o.fill < 0.997 && o.boxA > 0.003 ? `inset 0 0 0 1px ${labCss(o.strokeLab, (1 - o.fill) * o.boxA)}` : 'none';
  const m = E.mark;
  if (o.mark < 0.003) { m.style.visibility = 'hidden'; return; }
  m.style.visibility = 'visible';
  m.setAttribute('d', pd(CHECK.map((p, i) => [lerp(p[0], DASH[i][0], o.dash), lerp(p[1], DASH[i][1], o.dash)])));
  m.setAttribute('stroke', labCss(C('Checkbox/Icon'), o.mark));
  m.setAttribute('stroke-dashoffset', (1 - clamp(o.draw)).toFixed(4));
}

function drawGlyph(E, x, y, lab, g) {
  const s = E.el.style;
  s.visibility = 'visible'; s.transform = `translate(${x.toFixed(3)}px,${y.toFixed(3)}px)`; s.color = labCss(lab);
  const shut = Math.abs(g.up[20][1] - g.lo[20][1]) < 0.01;
  E.a.setAttribute('d', pd(g.up));
  E.b.setAttribute('d', shut ? '' : pd(g.lo));          // shut, the lower lid lies under the upper: draw one stroke
  E.clip.setAttribute('d', pd(g.up.concat(g.lo.slice().reverse())) + 'Z');
  E.lash.forEach((l, i) => l.setAttribute('d', g.lashes[i] ? pd(g.lashes[i]) : ''));
  E.p.setAttribute('cx', g.pupil[0].toFixed(3)); E.p.setAttribute('cy', g.pupil[1].toFixed(3));
  E.p.style.visibility = shut ? 'hidden' : 'visible';
  E.v.setAttribute('d', g.stem > 0.01 ? `M12 ${(12 - 7 * g.stem).toFixed(3)}L12 ${(12 + 7 * g.stem).toFixed(3)}` : '');
}

function seek(tIn) {
  const t = ((tIn % LOOP) + LOOP) % LOOP;
  const at = n => TR[n].at(t), op = n => clamp(TR[n].at(t));
  const canvas = labCss(C('Background/Level2'));
  if (!TRANSPARENT) { EL.stage.style.background = canvas; document.body.style.background = canvas; document.documentElement.style.background = canvas; }

  // camera
  const cs = Math.exp(at('camS')), ccx = at('camX'), ccy = at('camY');
  EL.world.style.transform = `translate(${(W / 2 - ccx * cs).toFixed(3)}px,${(H / 2 - ccy * cs).toFixed(3)}px) scale(${cs.toFixed(5)})`;
  BLUR = 9 / cs;

  // the shape
  const w = at('w'), h = at('h'), cx = at('cx'), cy = at('cy');
  const rad = Math.max(0, Math.min(at('rad'), w / 2, h / 2));
  const SX = cx - w / 2, SY = cy - h / 2;
  const st = EL.shape.style;
  st.width = w.toFixed(3) + 'px'; st.height = h.toFixed(3) + 'px'; st.borderRadius = rad.toFixed(3) + 'px';
  const na = op('naA'), pk = 1 - at('press'), nk = 0.86 + 0.14 * na;     // the opener's grow/shrink is about its centre
  st.transform = `translate(${(SX + pk * w / 2 * (1 - nk)).toFixed(3)}px,${(SY + pk * h / 2 * (1 - nk)).toFixed(3)}px) scale(${(pk * nk).toFixed(5)})`;
  const fa = op('fillA'), sa = op('strokeA');
  st.opacity = na.toFixed(4); st.filter = na > 0.997 ? 'none' : `blur(${((1 - na) * BLUR).toFixed(3)}px)`;
  st.background = fa > 0.002 ? labCss(TR.fill.at(t), fa) : 'transparent';
  st.boxShadow = sa > 0.003 ? `inset 0 0 0 1px ${labCss(TR.stroke.at(t), sa)}` : 'none';
  EL.inner.style.transform = `translate(${(-SX).toFixed(3)}px,${(-SY).toFixed(3)}px)`;

  // header checkbox — in act I its mark rides the shape (which is the box)
  const hcFill = op('hcFill');
  drawCB(EL.hc, 22, 86, { op: Math.max(op('hcBox'), op('hcMark')), boxA: op('hcBox'), fill: hcFill * op('hcBox'),
    fillLab: C('Checkbox/Fill/Default'), strokeLab: C('Field/Stroke/Default'),
    mark: op('hcMark'), draw: at('hcDraw'), dash: clamp(at('hcDash')) });

  // header row
  const hy = 86;
  for (let k = 0; k < 5; k++) { const o = op('ht' + k); put(EL.ht[k], COLS[k] + 12 + (1 - o) * 6, hy, o, C('Table/Text/Header')); }
  box(EL.hdiv, 16, 107, 536, 1, C('Table/Divider'), op('hdiv'));

  // group rows — an accordion: Currency rides down as the Stocks rows unfold under their group
  let unfolded = 0;
  for (let r = 0; r < NSTOCK; r++) unfolded += op('ra' + r);
  const gy = [108, 136 + 24 * unfolded];
  ['g0', 'g1'].forEach((g, i) => {
    const E = EL.g[i], dy = at(g + 'dy'), y = gy[i] + dy;
    box(E.fill, 16, y, 536, 28, C('Group-row/Fill/Default'), op(g + 'fill'));
    putI(E.chev, 22, y + 6, op(g + 'chev'), C('Button/Icon/Unfilled/Default'), at(g + 'rot'));
    put(E.text, 56, y + 6, op(g + 'text'), C('Table/Text/Header'));
    box(E.div, 16, y + 27, i === 0 ? at('g0divW') : 536, 1, C('Table/Divider'), op(g + 'div'));
  });

  // rows
  const hovLab = C('Table/Fill/Hover'), selLab = C('Table/Fill/Selected'), divLab = C('Table/Divider'), valLab = C('Table/Text/Value');
  for (let r = 0; r < ROWS.length; r++) {
    const E = EL.rows[r], a = op('ra' + r), hv = op('rh' + r), sl = op('rs' + r);
    const base = r < NSTOCK ? 136 + 24 * r : gy[1] + 28 + 24 * (r - NSTOCK);
    const y = base + at('rdy' + r);
    const rev = Math.max(hv, sl);
    box(E.fill, 16, y, 536, 24, mix(hovLab, selLab, sl), rev * a);              // row fill: hover under selected
    box(E.div, 16, y + 23, 536, 1, divLab, a);
    // control: logo ↔ checkbox in the same slot
    const logoOp = a * (1 - rev);
    if (E.logo.tagName === 'IMG') put(E.logo, 22, y + 4, logoOp);
    else put(E.logo, 20, y + 5, logoOp);
    drawCB(E.cb, 22, y + 4, { op: a * rev, boxA: 1, fill: sl, fillLab: C('Checkbox/Fill/Default'),
      strokeLab: C('Field/Stroke/Default'), mark: sl, draw: at('rd' + r), dash: 0 });
    for (let k = 0; k < 5; k++) put(E.t[k], COLS[k] + 12, y + 4, a, valLab);
  }

  // tabs
  const sel2 = op('sel2');
  for (let k = 0; k < 5; k++) {
    const selk = k === 0 ? 1 - sel2 : k === 2 ? sel2 : 0, hovk = k === 2 ? op('hov2') : k === 0 ? op('hov0') : 0;
    const lab = mix(mix(C('Tab/Text/Unselected/Default'), C('Tab/Text/Unselected/Hover'), hovk), C('Tab/Text/Selected/Default'), selk);
    put(EL.tabs[k], L.tabX[k], 48, op('tab' + k), lab);
  }
  box(EL.tdiv, 16, 71, at('tdivW'), 1, C('Tab/Divider'), op('tdiv'));
  box(EL.ind, at('indX'), 70, at('indW'), 2, C('Tab/Indicator/Default'), op('ind'));

  // widget header: title · chevron · link · Badge, then the actions (the first is New Button · Primary)
  put(EL.title, 16, 20 - TY.title.lh / 2, op('title'), C('Text/Primary'));
  putI(EL.chev, L.chevX, 12, op('chev'), C('Icon/Primary'));
  putI(EL.link, L.linkX, 12, op('link'), C('Icon/Primary'));
  // the + button: the shape is its surface at the start and after the fold; in between it is its own surface in the header
  const pp = op('primPress');
  const primLab = mix(mix(C('Button/Fill/Primary/Default'), C('Button/Fill/Primary/Hover'), op('primHov')), C('Button/Fill/Primary/Pressed'), pp);
  box(EL.prim, L.prim.x + pp, L.prim.y + pp, 32 - 2 * pp, 32 - 2 * pp, primLab, op('primBg'), 4);
  // the opener's label and the eye → plus glyph; the pupil glances toward the cursor
  put(EL.naT, L.naX, 20 - TY.btn.lh / 2, op('naT'), TR.naInk.at(t));
  const gx = L.iconX(0), kx0 = at('curX'), ky0 = at('curY');
  const px = 1.2 * Math.tanh((kx0 - gx - 8) / 50), py = 0.9 * Math.tanh((ky0 - 20) / 50);
  drawGlyph(EL.glyph, gx, 12, TR.ink.at(t), glyphGeom(clamp(at('eyeO')), clamp(at('eyeF')), Math.max(0, at('plusV')), clamp(at('lashK')), px, py));
  for (let k = 1; k < 6; k++) { const o = op('act' + k); putI(EL.acts[k], L.iconX(k), 12, o, C('Button/Icon/Unfilled/Default'), 0, 0.7 + 0.3 * o); }
  const bo = op('badge'), bs = EL.badge.style;
  if (bo > 0.003) {
    bs.display = '';
    bs.transform = `translate(${L.badge.x}px,${L.badge.y}px) scale(${at('badgeSc').toFixed(4)})`;
    bs.opacity = bo.toFixed(4);
    bs.filter = bo > 0.997 ? 'none' : `blur(${((1 - bo) * BLUR).toFixed(3)}px)`;
    bs.background = labCss(C('Badge/Fill/Brand'));
    putI(EL.badgeIcon, 8, 4, 1, C('Badge/Icon/Brand'));
    put(EL.badgeT, 28, 4, 1, C('Badge/Text/Brand'));
  } else if (bs.display !== 'none') bs.display = 'none';

  // action panel
  const ap = EL.ap.style, apDy = at('apDy'), apBg = op('apBg');
  const apVis = Math.max(op('apInfo'), op('fav'), op('v3'), apBg);
  if (apVis > 0.003) {
    ap.display = ''; ap.visibility = 'visible';
    ap.transform = `translate(${L.ap.l}px,${(L.ap.t + apDy).toFixed(3)}px)`;
    ap.background = apBg > 0.003 ? labCss(C('Background/Level3'), apBg) : 'transparent';
    ap.boxShadow = apBg > 0.003 ? `inset 0 0 0 1px ${labCss(C('Field/Stroke/Default'), apBg)}` : 'none';
    const by = L.apBy;
    putI(EL.apInfo, 13, by + 4, op('apInfo'), C('Icon/Secondary'));
    for (let i = 0; i < 5; i++) put(EL.apVal[i], 37, by + 12 - TY.apVal.lh / 2 + at('vdy' + i), op('v' + i), C('Text/Secondary'));
    const fx = L.apFav.x + at('favDx'), fo = op('fav');
    box(EL.favBg, fx, by, L.apFav.w, 24, C('Button/Fill/Unfilled/Hover'), op('favHov') * fo, TY.btnR);
    putI(EL.favStar, fx + 8, by + 4, fo, C('Button/Icon/Unfilled/Default'));
    put(EL.favT, fx + 28, by + 12 - TY.btn.lh / 2, fo, C('Button/Text/Unfilled/Default'));
    putI(EL.favChev, fx + 32 + M.fav, by + 4, fo, C('Button/Icon/Unfilled/Default'));
    const ax = L.apAdd.x + at('addDx'), ao = op('add'), pr = op('addPress');
    const addLab = mix(mix(C('Button/Fill/Primary/Default'), C('Button/Fill/Primary/Hover'), op('addHov')), C('Button/Fill/Primary/Pressed'), pr);
    box(EL.addBg, ax + pr * 1.5, by + pr * 0.6, L.apAdd.w - pr * 3, 24 - pr * 1.2, addLab, ao, TY.btnR);
    put(EL.addT, ax + 8, by + 12 - TY.btn.lh / 2, ao, C('Button/Text/Primary/Default'));
    const xx = L.apX.x + at('xDx'), xo = op('x');
    box(EL.xBg, xx, by, 24, 24, mix(C('Button/Fill/Unfilled/Hover'), C('Button/Fill/Unfilled/Pressed'), op('xPress')), op('xHov') * xo, TY.btnR);
    putI(EL.x, xx + 4, by + 4, xo, C('Button/Icon/Unfilled/Default'));
  } else if (ap.display !== 'none') ap.display = 'none';

  // curve-promo-drop1 (local coordinates inside the dropdown)
  const dO = op('ddOp'), ds = EL.dd.style;
  if (dO > 0.003) {
    ds.display = '';
    ds.transform = `translate(${L.dd.l}px,${(L.dd.t + at('ddDy')).toFixed(3)}px) scale(${at('ddSc').toFixed(4)})`;
    ds.opacity = dO.toFixed(4);
    ds.filter = dO > 0.997 ? 'none' : `blur(${((1 - dO) * BLUR * 0.6).toFixed(3)}px)`;
    ds.background = labCss(C('Background/Level2'));
    ds.boxShadow = `inset 0 0 0 1px ${labCss(C('Stroke/Divider'))}, 0 4px 4px rgba(0,0,0,.3), 0 8px 12px 6px rgba(0,0,0,.15)`;
    for (let k = 0; k < 3; k++) {                        // the items stay as they are: the cursor goes straight to Try free
      const y = 5 + 32 * k;
      box(EL.ddHov[k], 1, y, 213, 32, C('Dropdown-Item/Fill/Hover'), 0);
      drawCB(EL.ddCb[k], 13, y + 8, { op: 1, boxA: 1, fill: 0, fillLab: C('Checkbox/Fill/Default'), strokeLab: C('Field/Stroke/Default'),
        mark: 0, draw: 0, dash: 0 });
      put(EL.ddT[k], 45, y + 8, 1, C('Dropdown-Item/Text/Label'));
    }
    EL.promo.style.background = labCss(C('Background/Main'));
    EL.curves.style.color = labCss(C('Icon/Primary'));
    EL.curveHi.setAttribute('fill', labCss(C('Dot-Indicator/Fill/Brand')));
    const cd = clamp(at('curveDraw')), cdots = clamp(at('curveDots'));       // the curve draws itself, then its points land
    EL.curvePaths.forEach((p, i) => p.setAttribute('stroke-dashoffset', (1 - clamp(cd * 1.15 - i * 0.075)).toFixed(4)));
    EL.curveDots.forEach(c => c.setAttribute('opacity', cdots.toFixed(4)));
    EL.curveHi.setAttribute('r', (5 * Math.max(0, at('curveDots'))).toFixed(3));
    put(EL.pTitle, 8, 8, 1, C('Text/Primary'));
    put(EL.pSub, 8, 32, 1, C('Text/Primary'));
    const cp = op('ctaPress');
    const ctaLab = mix(mix(C('Button/Fill/Primary/Default'), C('Button/Fill/Primary/Hover'), op('ctaHov')), C('Button/Fill/Primary/Pressed'), cp);
    box(EL.ctaBg, 8 + cp * 1.5, 64 + cp * 0.6, L.cta.w - cp * 3, 24 - cp * 1.2, ctaLab, 1, TY.btnR);
    put(EL.ctaT, 22, 68, 1, C('Button/Text/Primary/Default'));
    putI(EL.ctaIcon, 28 + M.try, 68, 1, C('Button/Icon/Primary/Default'));
    putI(EL.pClose, 185, 4, 1, C('Button/Icon/Unfilled/Default'));
  } else if (ds.display !== 'none') ds.display = 'none';

  // cursor (screen space, projected from the world)
  const kx = at('curX'), ky = at('curY');
  const scx = W / 2 + (kx - ccx) * cs, scy = H / 2 + (ky - ccy) * cs;
  const csz = clamp(1.25 * Math.pow(cs, 0.45), 2.1, 4) * (1 - 0.12 * at('curP'));
  EL.cursor.style.transform = `translate(${scx.toFixed(3)}px,${scy.toFixed(3)}px) scale(${csz.toFixed(5)})`;

  // the opening headline (screen space)
  const saveBlur = BLUR; BLUR = 8;
  HEADLINE.forEach((w, k) => put(EL.hl[k], L.hlX[k], TY.hlY + at('hldy' + k), op('hl' + k), C('Text/Primary')));
  BLUR = saveBlur;
  return t;
}

/* ═══ Live embed: theme + sound, controllable inside the frame and from the host page ═══ */
let TRANSPARENT = Q.get('canvas') === 'transparent';
const Live = { theme: 1, from: 1, t0: -1e9, sound: false, ctx: null, buffer: null, src: null, gain: null, wall0: 0, audio0: 0, loading: null };
const THEME_SP = spring(0.36, 1), INK_SP = spring(0.12, 1);
function themeAt(now) {                                 // surface + ink springs in wall-clock time
  const d = Live.theme - Live.from;
  return [Live.from + d * S(now - Live.t0, THEME_SP), Live.from + d * S(now - Live.t0 - 0.07, INK_SP)];
}
function setTheme(v, animate = true) {
  const now = performance.now() / 1000;
  Live.from = animate ? themeAt(now)[0] : v; Live.theme = v; Live.t0 = animate ? now : -1e9;
  document.documentElement.dataset.theme = v ? 'light' : 'dark';
  syncControls(); postState();
}
function phase() {                                      // loop time: the audio clock when sound is on, else the wall clock
  if (Live.sound && Live.ctx) return (Live.ctx.currentTime - (Live.ctx.outputLatency || Live.ctx.baseLatency || 0) - Live.audio0) % LOOP;
  return (performance.now() / 1000 - Live.wall0) % LOOP;
}
async function loadAudio() {
  if (Live.buffer) return Live.buffer;
  if (!Live.loading) Live.loading = (async () => {
    let bytes = null;
    if (/^https?:$/.test(location.protocol)) {           // served: fetch the lossless sidecar
      try { const r = await fetch(Q.get('audio') || 'table-loop.flac'); if (r.ok) bytes = await r.arrayBuffer(); } catch (e) { /* fall back */ }
    }
    if (!bytes) bytes = await scriptAudio();               // opened from disk: fetch() is blocked on file://, a <script> is not
    return (Live.buffer = await Live.ctx.decodeAudioData(bytes));
  })().catch(e => { Live.loading = null; throw e; });     // a failed load can be retried
  return Live.loading;
}
function scriptAudio() {                                // table-loop.audio.js = the same FLAC as base64 in window.TABLE_LOOP_AUDIO
  return new Promise((resolve, reject) => {
    const done = () => {
      const b64 = window.TABLE_LOOP_AUDIO;
      if (!b64) return reject(new Error('the audio script holds no audio'));
      const bin = atob(b64), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      resolve(u.buffer);
    };
    if (window.TABLE_LOOP_AUDIO) return done();
    const el = document.createElement('script');
    el.src = Q.get('audiojs') || 'table-loop.audio.js';
    el.onload = done; el.onerror = () => reject(new Error('could not load ' + el.src));
    document.head.appendChild(el);
  });
}
async function setSound(on) {
  if (on === Live.sound || Live.busy) return postState();
  if (on) {
    Live.busy = true;                                    // ignore repeat clicks while the audio loads
    try {
      Live.ctx = Live.ctx || new (window.AudioContext || window.webkitAudioContext)();
      // Without a gesture in this frame (e.g. a host page opened from disk) resume() never settles — don't wait on it forever.
      const resumed = await Promise.race([Live.ctx.resume().then(() => true), new Promise(r => setTimeout(() => r(false), 300))]);
      if (!resumed || Live.ctx.state !== 'running') throw new Error('autoplay blocked: click inside the frame');
      await loadAudio();
      const p = phase(), lat = Live.ctx.outputLatency || Live.ctx.baseLatency || 0, when = Live.ctx.currentTime + 0.06;
      const src = Live.ctx.createBufferSource(), g = Live.ctx.createGain();
      src.buffer = Live.buffer; src.loop = true; src.loopStart = 0; src.loopEnd = LOOP;
      g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + 0.06);
      src.connect(g).connect(Live.ctx.destination);
      const off = ((p + 0.06 + lat) % LOOP + LOOP) % LOOP;
      src.start(when, off);
      Live.audio0 = when - off; Live.src = src; Live.gain = g; Live.sound = true;
    } catch (e) {
      Live.sound = false; Live.busy = false; Live.wantSound = /autoplay/.test(String(e.message || e));
      syncControls(); postState({ error: String(e.message || e) }); return;
    }
    Live.busy = false; Live.wantSound = false;
  } else {
    const p = phase();
    Live.wall0 = performance.now() / 1000 - p;
    const { src, gain, ctx } = Live;
    if (src) { gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.06); src.stop(ctx.currentTime + 0.07); }
    Live.src = null; Live.sound = false;
  }
  syncControls(); postState();
}
function syncControls() {
  const bs = document.getElementById('btnSound'), bt = document.getElementById('btnTheme');
  const show = (id, on) => document.getElementById(id).toggleAttribute('hidden', !on);   // SVG has no .hidden property
  show('icoSoundOn', Live.sound); show('icoSoundOff', !Live.sound);
  bs.setAttribute('aria-pressed', String(Live.sound)); bs.setAttribute('aria-label', Live.sound ? 'Turn sound off' : 'Turn sound on');
  show('icoSun', !Live.theme); show('icoMoon', !!Live.theme);            // dark shows the sun (go light), light shows the moon
  bt.setAttribute('aria-label', Live.theme ? 'Switch to dark theme' : 'Switch to light theme');
}
function styleControls() {
  const r = document.documentElement.style;
  r.setProperty('--ctl-fill', 'transparent');
  r.setProperty('--ctl-fill-hover', labCss(C('Button/Fill/Unfilled/Hover')));
  r.setProperty('--ctl-fill-press', labCss(C('Button/Fill/Unfilled/Pressed')));
  r.setProperty('--ctl-icon', labCss(C('Button/Icon/Unfilled/Default')));
  r.setProperty('--ctl-ring', labCss(C('Button/Stroke/Secondary/Focused')));
}
function postState(extra = {}) {
  if (window.parent === window) return;
  window.parent.postMessage({ type: MSG + ':state', theme: Live.theme ? 'light' : 'dark', sound: Live.sound, ...extra }, '*');
}
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object' || d.type !== MSG) return;
  if ('theme' in d) {
    Live.touched = true;
    if (d.theme === 'system') { Live.touched = false; setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 0 : 1); }
    else setTheme(d.theme === 'toggle' ? 1 - Live.theme : d.theme === 'light' ? 1 : 0);
  }
  if ('sound' in d) setSound(d.sound === 'toggle' ? !Live.sound : !!d.sound);
  if ('ui' in d) setUi(d.ui);
  if (d.get) postState();
});
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  EL.stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - H * k) / 2}px) scale(${k})`;
}

/* ═══ Boot ═══ */
async function init() {
  await Promise.all(['400 12px Inter', '500 12px Inter', '400 14px Inter', '500 14px Inter', '700 68px Inter'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  measure(); layout(); build(); timeline();
  const qTheme = Q.get('theme');
  // A theme the host already sent (it can arrive before fonts load) wins over the URL and the OS preference.
  const initial = Live.touched ? Live.theme : qTheme ? (qTheme === 'light' ? 1 : 0) : (matchMedia('(prefers-color-scheme: dark)').matches ? 0 : 1);
  Live.theme = Live.from = initial;
  [THEME, THEME_INK] = [initial, initial];
  window.seek = seek; window.TR = TR; window.L = L; window.LOOP = LOOP; window.EVENTS = EVENTS; window.B = B;
  window.renderTheme = v => { THEME = THEME_INK = v; };         // render hook: fixed theme, no animation
  window.fontOk = document.fonts.check('500 12px Inter') && document.fonts.check('400 12px Inter') && document.fonts.check('700 68px Inter');
  window.cursorScreen = t => { const cs = Math.exp(TR.camS.at(t)); return [W / 2 + (TR.curX.at(t) - TR.camX.at(t)) * cs, H / 2 + (TR.curY.at(t) - TR.camY.at(t)) * cs]; };
  if (RENDER) {
    document.documentElement.classList.add('render');
    seek(Q.has('t') ? parseFloat(Q.get('t')) : 0);
    window.ready = true;
    return;
  }
  if (Q.get('controls') === '0') document.documentElement.classList.add('nocontrols');
  if (TRANSPARENT) { document.documentElement.style.background = document.body.style.background = 'transparent'; }
  fit(); addEventListener('resize', fit);
  document.getElementById('btnSound').addEventListener('click', () => setSound(!Live.sound));
  // A sound request the browser blocked (no gesture in this frame) starts on the next click or key inside the frame.
  const retry = e => { if (Live.wantSound && !Live.sound && !(e.target.closest && e.target.closest('#btnSound'))) setSound(true); };
  addEventListener('pointerdown', retry, true); addEventListener('keydown', retry, true);
  document.getElementById('btnTheme').addEventListener('click', () => { Live.touched = true; setTheme(1 - Live.theme); });
  // Follow the OS / browser theme live until the visitor or the host picks one.
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (!qTheme && !Live.touched) setTheme(e.matches ? 0 : 1); });
  syncControls();
  Live.wall0 = performance.now() / 1000 - L.HL0;         // open on the headline, not on the downbeat
  // Visitors who ask for reduced motion get the assembled table as a still (motion=1 overrides).
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches && Q.get('motion') !== '1';
  const frozen = Q.has('t') ? parseFloat(Q.get('t')) : reduced ? B(28) + 0.3 : null;
  const tick = () => {
    [THEME, THEME_INK] = themeAt(performance.now() / 1000);
    styleControls();
    seek(frozen != null ? frozen : phase());
    requestAnimationFrame(tick);
  };
  window.ready = true;
  postState({ ready: true });
  requestAnimationFrame(tick);
}
init();
</script>
