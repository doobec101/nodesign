    /* =========================================================
       Tokens — snapshot of the Ardor first-screen system.
       Layout units are "design px"; `.ui` applies --ui-scale
       via zoom, the same way the reference does (body zoom 1.25).
       ========================================================= */
    :root {
      --ui-scale: 1.25;

      /* color — light theme is the dark one mirrored */
      --color-background: #F4F3FA;
      --color-surface: #ffffffbf;        /* #FFF · 75% */
      --color-surface-ink: #0009;        /* #000 · 60% */
      --color-ink: #0B0A16;
      --color-ink-muted: #0b0a169e;      /* 62% */
      --color-ink-faint: #0b0a1685;      /* 52% */
      --color-on-ink: #F4F3FA;
      --color-accent: #4D0099;           /* declared, unused on screen — lives in the shader as light */

      /* aurora — palette by trail intensity: core (0) → low (.18) → mid (.45) → high (.72) → peak (1);
         cap = lightness ceiling that keeps glow from blowing out.
         Same three hues as dark — lavender halo → magenta rim → periwinkle core — as tints on a pale ground. */
      --aurora-core: #EDEAF7;
      --aurora-low:  #D4C7EF;
      --aurora-mid:  #E29BCB;
      --aurora-high: #B3C2F2;
      --aurora-peak: #DCE2F8;
      --aurora-cap:  #F1F3FF;

      /* type */
      --font-sans: "Roboto Flex", system-ui, -apple-system, "Segoe UI", Arial, Helvetica, sans-serif;
      --font-display: "Neue Machina", "Roboto Flex", system-ui, sans-serif;
      --text-body: 13px;       --leading-body: 1.2;
      --text-label: 13px;      --leading-label: .9;
      --text-caption: 10px;    --leading-caption: .9;
      --text-heading: 32px;    --leading-heading: 1;
      --text-subheading: 19px; --leading-subheading: 1.2;
      --tracking-tight: -.025em;
      --tracking-wider: .05em;

      /* shape */
      --radius-pill: 19.218px;
      --radius-card: 20px;
      --radius-plate: 25px;

      /* layout */
      --container-content: 762px;
      --container-media: 506px;
      --container-copy: 378px;
      --page-gutter: 20px;
      --spacing-section: 180px;
      --spacing-grid: 52px;
      --spacing-gutter: 6px;
      --header-h: 62px;
      --scrim-h: 112px;

      /* plate */
      --plate-pad-x: 16px;
      --plate-pad-b: 14px;
      --plate-field-pt: 16px;
      --plate-field-min: 36px;
      --plate-field-max: 144px;
      --plate-tools-bottom: 11px;
      --plate-tools-gap: 13px;
      --send-size: 28px;
      --send-icon: 24px;
      --send-idle-opacity: .3;

      /* effects */
      --blur-surface: 10px;
      --blur-scrim: 12px;
      --dot: 3.2px;
      --dot-gap: 4px;

      /* motion */
      --ease-standard: cubic-bezier(.4, 0, .2, 1);
      --ease-out: cubic-bezier(0, 0, .2, 1);
      --dur-quiet: .15s;
      --dur-arrow: .2s;
      --dur-reveal: .28s;
      --dur-reveal-blur: .56s;
      --dur-panel: .3s;
      --dur-placeholder: 3.4s;
      --quiet-opacity: .6;
    }

    [data-theme="dark"] {
      --color-background: #0C0B16;
      --color-surface: #17162Abf;
      --color-surface-ink: #eeedf299;
      --color-ink: #EEEDF2;
      --color-ink-muted: #eeedf2a6;
      --color-ink-faint: #eeedf278;
      --color-on-ink: #0C0B16;
      --color-accent: #C2A0FF;
      --aurora-core: #1E1A3C;
      --aurora-low:  #5F3A9E;
      --aurora-mid:  #A8367F;
      --aurora-high: #4C6BD0;
      --aurora-peak: #33429A;
      --aurora-cap:  #6A80D8;
    }

    /* < md: the reference drops the zoom and goes to 16 / 36 */
    @media (max-width: 767px) {
      :root {
        --ui-scale: 1;
        --text-body: 16px;
        --text-label: 16px;
        --text-caption: 12px;
        --text-subheading: 22px;
        --text-heading: 36px;
      }
    }

    /* ---------- base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    /* background lives on <html> only: a body background would paint OVER the z −10 canvas */
    html { background: var(--color-background); }
    body {
      margin: 0;
      min-height: 100lvh;
      color: var(--color-ink);
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    :focus-visible { outline: 1.5px solid var(--color-ink); outline-offset: 3px; border-radius: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

    /* ---------- z −10 · shader ---------- */
    .aurora {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100lvh;
      z-index: -10;
      pointer-events: none;
      background: var(--color-background);
    }
    /* no-WebGL fallback: four static washes in the same tokens */
    .aurora.is-static {
      background-image:
        radial-gradient(58% 72% at 12% 18%, var(--aurora-mid)  0%, transparent 62%),
        radial-gradient(52% 64% at 78% 12%, var(--aurora-low)  0%, transparent 66%),
        radial-gradient(64% 80% at 88% 76%, var(--aurora-high) 0%, transparent 64%);
    }

    /* ---------- scaled UI ---------- */
    .ui {
      zoom: var(--ui-scale);
      min-height: calc(100lvh / var(--ui-scale));
      position: relative;
    }

    /* ---------- z 40 · header scrim ---------- */
    .scrim {
      position: fixed; inset: 0 0 auto 0;
      height: var(--scrim-h);
      z-index: 40;
      pointer-events: none;
      -webkit-backdrop-filter: blur(var(--blur-scrim));
      backdrop-filter: blur(var(--blur-scrim));
      -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 30%, transparent 100%);
    }

    /* ---------- z 50 · header ---------- */
    .site-header {
      position: fixed; inset: 0 0 auto 0;
      z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px var(--page-gutter);
      background: transparent;
    }
    /* wordmark is plain text, set exactly like a nav link */
    .logo, .nav a, .cta {
      font-size: var(--text-label); line-height: var(--leading-label);
      white-space: nowrap;
    }
    .logo { color: inherit; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; margin: -4px 0;
      color: var(--color-ink);
    }
    .theme-toggle svg { display: block; }
    .theme-toggle .ic-sun, [data-theme="dark"] .theme-toggle .ic-moon { display: none; }
    [data-theme="dark"] .theme-toggle .ic-sun { display: block; }
    .nav { display: flex; align-items: center; gap: 10px; }
    .cta {
      display: inline-flex; align-items: center; gap: 20px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      background: var(--color-ink);
      color: var(--color-on-ink);
    }
    .cta svg { flex: none; display: block; transition: transform var(--dur-arrow) var(--ease-standard); }
    @media (hover: hover) { .cta:hover svg { transform: translateX(2px); } }

    /* quiet interaction: opacity only, never color */
    .quiet { transition: opacity var(--dur-quiet) var(--ease-standard); }
    @media (hover: hover) { .quiet:hover { opacity: var(--quiet-opacity); } }

    /* mobile menu (< md): a glass plate that grows out of the burger */
    .menu { display: none; position: relative; z-index: 1; width: 40px; height: 40px; }
    .menu-plate {
      position: absolute; top: 0; left: 0;
      display: grid; grid-template-rows: auto 0fr;
      width: 40px; overflow: hidden;
      border-radius: var(--radius-card);
      background: var(--color-surface);
      -webkit-backdrop-filter: blur(var(--blur-surface));
      backdrop-filter: blur(var(--blur-surface));
      transition: width var(--dur-panel) var(--ease-out), grid-template-rows var(--dur-panel) var(--ease-out);
    }
    .menu.is-open .menu-plate { width: 136px; grid-template-rows: auto 1fr; }
    .menu-btn { display: flex; width: 40px; height: 40px; align-items: center; justify-content: center; }
    .menu-btn svg { display: block; }
    .menu-btn .ic-close, .menu.is-open .menu-btn .ic-burger { display: none; }
    .menu.is-open .menu-btn .ic-close { display: block; }
    .menu-list-wrap { min-height: 0; overflow: hidden; }
    .menu-list {
      display: flex; flex-direction: column; padding-bottom: 22px;
      opacity: 0; filter: blur(3px);
      transition: opacity var(--dur-arrow) var(--ease-out), filter var(--dur-arrow) var(--ease-out);
    }
    .menu.is-open .menu-list { opacity: 1; filter: none; transition-delay: var(--dur-arrow); }
    .menu-list a, .menu-list button {
      padding: 15px 14px; text-align: left;
      font-size: var(--text-label); line-height: var(--leading-label); white-space: nowrap;
      color: var(--color-ink);
    }

    /* ---------- z 50 · footer: © year + wordmark, bottom centre ---------- */
    .site-footer {
      position: fixed; left: 0; right: 0; bottom: var(--page-gutter);
      z-index: 50; pointer-events: none;
      display: flex; justify-content: center; align-items: center; gap: 5px;
      font-size: var(--text-label); line-height: var(--leading-label); white-space: nowrap;
      color: var(--color-ink-muted);
    }
    .site-footer a { pointer-events: auto; }

    /* ---------- hero ---------- */
    .hero {
      min-height: calc(100lvh / var(--ui-scale));
      display: flex; align-items: center; justify-content: center;
      /* centre the block in the field below the header → sits a little under optical centre */
      padding: calc(var(--header-h) / 2) var(--page-gutter) 0;
    }
    .hero-inner {
      width: 100%; max-width: var(--container-content);
      display: flex; flex-direction: column; align-items: center;
      gap: 23px; position: relative;
    }
    .hero-copy {
      width: 100%;
      display: flex; flex-direction: column; align-items: center;
      gap: 20px; text-align: center;
      transition: opacity var(--dur-reveal) var(--ease-out);
    }

    /* ---------- chat mode: copy fades, thread grows above a docked composer ---------- */
    body.is-chat .hero {
      min-height: 0; align-items: flex-start;
      padding-top: calc(var(--header-h) + 20px);
      padding-bottom: calc(var(--composer-h, 50px) + var(--page-gutter) * 2);
    }
    body.is-chat .hero-copy { position: absolute; inset: 0 auto auto 0; opacity: 0; pointer-events: none; }
    body.is-chat .plate-wrap {
      position: fixed; left: var(--page-gutter); right: var(--page-gutter); bottom: var(--page-gutter);
      margin: 0 auto; z-index: 40;
    }
    body.is-chat .site-footer { opacity: 0; pointer-events: none; }
    .site-footer { transition: opacity var(--dur-reveal) var(--ease-out); }

    .thread {
      display: none; width: 100%; max-width: var(--container-media);
      flex-direction: column; gap: 18px;
      font-size: var(--text-label); line-height: 1.4;
    }
    body.is-chat .thread { display: flex; }
    .msg { animation: chat-line-in var(--dur-arrow) var(--ease-out) both; scroll-margin-top: calc(var(--header-h) + 20px); }
    .msg-q { color: var(--color-ink-muted); }
    .msg-a { color: var(--color-ink); }
    .msg-a .text { white-space: pre-line; }
    .msg-a a { text-decoration: underline; text-underline-offset: 2px; }
    /* answer meta: time + copy, on hover (always on touch) */
    .meta {
      display: flex; align-items: center; gap: 10px; margin-top: 8px;
      font-size: var(--text-caption); line-height: var(--leading-caption); letter-spacing: var(--tracking-wider);
      color: var(--color-ink-faint);
      opacity: 0; transition: opacity var(--dur-quiet) var(--ease-standard);
    }
    .msg-a:hover .meta, .msg-a:focus-within .meta { opacity: 1; }
    @media (hover: none) { .meta { opacity: 1; } }
    .copy { display: inline-flex; align-items: center; gap: 4px; color: inherit; text-transform: lowercase; }
    .copy svg { display: block; }
    .typing { display: flex; gap: var(--dot-gap); padding: 6px 0; }
    .typing i {
      display: block; width: var(--dot); height: var(--dot); border-radius: 50%;
      background: var(--color-ink); opacity: .35;
      animation: chat-typing-dot 1s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes chat-line-in { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
    @keyframes chat-typing-dot { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }

    /* ---------- z 40 · branches: every question of the conversation, in the left gutter (≥ xl) ---------- */
    .branches {
      position: fixed; left: var(--page-gutter); top: calc(var(--header-h) + 20px); bottom: calc(var(--composer-h, 50px) + var(--page-gutter) * 2);
      width: 180px; z-index: 40; overflow-y: auto;
      display: none; flex-direction: column; align-items: flex-start; gap: 12px;
      scrollbar-width: none;
    }
    .branches .cap {
      font-size: var(--text-caption); line-height: var(--leading-caption); letter-spacing: var(--tracking-wider);
      text-transform: uppercase; color: var(--color-ink-faint); margin-bottom: 2px;
    }
    .branch {
      max-width: 100%; text-align: left;
      font-size: var(--text-label); line-height: 1.2; color: var(--color-ink-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      animation: chat-line-in var(--dur-arrow) var(--ease-out) both;
      transition: color var(--dur-quiet) var(--ease-standard);
    }
    .branch.is-active { color: var(--color-ink); }
    @media (min-width: 1200px) { body.is-chat .branches { display: flex; } }
    .display {
      margin: 0; width: 100%;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: var(--text-heading); line-height: var(--leading-heading);
      letter-spacing: normal;
      color: var(--color-ink);
      text-wrap: balance;
      position: relative;
      display: flex; flex-direction: column; justify-content: center;
    }
    @media (min-width: 1024px) { .display { white-space: nowrap; } }
    .lede {
      margin: 0; max-width: var(--container-media);
      text-wrap: balance;
      font-size: var(--text-body); line-height: var(--leading-body);
      color: var(--color-ink-muted);
    }

    /* ---------- plate ---------- */
    .plate-wrap { width: 100%; max-width: var(--container-media); position: relative; }
    .plate {
      position: relative; width: 100%;
      display: flex; flex-direction: column; overflow: hidden;
      padding: 0 var(--plate-pad-x) var(--plate-pad-b);
      border-radius: var(--radius-plate);
      background: var(--color-surface);
      -webkit-backdrop-filter: blur(var(--blur-surface));
      backdrop-filter: blur(var(--blur-surface));
      transition: padding var(--dur-panel) var(--ease-standard), border-radius var(--dur-panel) var(--ease-standard);
    }
    .plate-field {
      position: relative; display: flex; width: 100%;
      padding-right: var(--tools-w, 156px);
      transition: padding var(--dur-panel) var(--ease-standard);
    }
    .plate textarea {
      flex: 1; width: 100%; min-width: 0;
      height: var(--plate-field-min); max-height: var(--plate-field-max);
      margin: 0; padding: var(--plate-field-pt) 0 0;
      resize: none; border: 0; outline: none; background: transparent;
      font: inherit; font-size: var(--text-label); line-height: 1.4;
      color: var(--color-ink);
      overflow-x: auto; overflow-y: hidden; white-space: pre;
      scrollbar-width: thin; scrollbar-color: transparent transparent;
      transition: height var(--dur-panel) var(--ease-standard);
    }
    .plate textarea.is-multiline { white-space: pre-wrap; overflow-y: auto; }
    .plate textarea::placeholder { color: transparent; }
    .placeholder {
      position: absolute; inset: 0 var(--tools-w, 156px) 0 0;
      padding-top: var(--plate-field-pt);
      pointer-events: none; overflow: hidden;
      font-size: var(--text-label); line-height: 1.4;
      color: var(--color-ink-muted);
      transition: right var(--dur-panel) var(--ease-standard);
    }
    .placeholder[hidden] { display: none; }
    .placeholder-text {
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      animation: hero-placeholder var(--dur-placeholder) ease-in-out both;
    }
    @keyframes hero-placeholder {
      0%        { opacity: 0; filter: blur(6px); transform: translateY(.9em); }
      12%, 86%  { opacity: 1; filter: blur(0);   transform: translateY(0); }
      100%      { opacity: 0; filter: blur(6px); transform: translateY(-.9em); }
    }
    .plate-tools {
      position: absolute; right: var(--plate-pad-x); bottom: var(--plate-tools-bottom);
      display: flex; align-items: center; gap: var(--plate-tools-gap);
      transition: bottom var(--dur-panel) var(--ease-standard);
    }
    .tab-hint {
      display: none; align-items: center;
      padding: 3px 5px 2px;
      border: 1px solid var(--color-ink-faint); border-radius: 5px;
      font-family: var(--font-sans); font-size: var(--text-caption); line-height: var(--leading-caption);
      letter-spacing: var(--tracking-wider); text-transform: lowercase;
      color: var(--color-ink-faint);
      transition: opacity var(--dur-quiet) var(--ease-standard);
    }
    @media (hover: hover) and (min-width: 768px) { .tab-hint { display: flex; } .tab-hint[hidden] { display: none; } }
    .send {
      width: var(--send-size); height: var(--send-size);
      display: grid; place-items: center;
      opacity: var(--send-idle-opacity); pointer-events: none;
    }
    .send svg { display: block; width: var(--send-icon); height: var(--send-icon); }
    .send.is-ready { opacity: 1; pointer-events: auto; }

    /* ---------- scramble text: real string for AT + invisible copy for width + live overlay ---------- */
    .scr { position: relative; display: inline-block; white-space: nowrap; }
    .scr-ghost { visibility: hidden; }
    .scr-live { position: absolute; inset: 0; }
    .display .block { display: block; }

    /* ---------- reveal on load ---------- */
    .reveal {
      opacity: 0; filter: blur(8px);
      transition: opacity var(--dur-reveal) var(--ease-out), filter var(--dur-reveal-blur) var(--ease-standard);
    }
    .reveal[data-reveal="shown"]   { opacity: 1; filter: blur(.001px); }
    .reveal[data-reveal="settled"] { opacity: 1; filter: none; }

    /* ---------- < md ---------- */
    @media (max-width: 767px) {
      .site-header {
        display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 15px;
      }
      .menu { display: block; }
      .header-right { justify-self: end; }
      .nav, .theme-toggle { display: none; }
      .cta { padding: 14px 16px; gap: 0; }
      .cta svg { display: none; }
      .plate { border-radius: var(--radius-pill); padding-bottom: 60px; }
      .plate-field, .placeholder { padding-right: 0; right: 0; }
      .plate textarea { min-height: 64px; }
      .plate-tools { bottom: 16px; }
      .reveal { opacity: 1; filter: none; transition: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; filter: none; transition: none; }
      .placeholder-text { animation: none; opacity: 1; }
      .msg, .branch, .typing i { animation: none; opacity: 1; }
      .hero-copy, .site-footer, .plate-wrap { transition: none; }
      .cta svg, .quiet, .plate, .plate-field, .placeholder, .plate-tools, .menu-plate, .menu-list { transition: none; }
    }
  </style>
</head>

  <script>
/* =========================================================
   EntropyText — a word that falls apart the further the
   cursor is from it, and heals as the cursor comes back.

   Drop-in:
     <h1 data-entropy>Entropy</h1>
     <script src="./entropy-text.js">   ← auto-inits every [data-entropy]

   Manual:
     const et = new EntropyText(el, { radius: 600 });
     et.intensity   // 0 = clean … 1 = fully decayed
     et.distance    // px from the cursor to the word's edge (Infinity = no cursor)
     et.flow        // { x, y } eased direction of the cursor's motion, |flow| ≤ 1
     et.rest(ms)    // hold the word clean for ms, then let it decay again (e.g. right after it re-enters the page)
     et.text        // the original word
     et.destroy()
     EntropyText.get(el)   // instance behind an auto-inited element
   The element may be moved around the DOM (or detached and re-attached) freely — the instance follows it.

   Options — pass as `data-entropy-<name>` attributes or in the constructor:
     delay      ms before the word may start to decay after init   (333)
     radius     px from the word's edge where decay is total;
                0 = auto ≈ 2.4 × font-size, capped at 35% of the
                viewport's shorter side, never under 160px          (0)
     inner      px halo around the word that always stays clean     (16)
     liquid     em — how far the outline flows (displacement)       (0.4)
     goo        em — blur → alpha threshold; rounds & merges blobs  (0.045)
     thicken    em — strokes swell as the glyph liquefies           (0.035)
     melt       glyphs sag downward from their top at full decay    (0.4)
     shift      em — per-glyph drift at full decay                  (0.2)
     rotate     deg — per-glyph tilt at full decay                  (16)
     scale      ± per-glyph size change at full decay               (0.2)
     jitter     0..1 — how much the decayed state keeps breathing   (1)
     flicker    0..1 — re-roll the noise field now and then         (0.35)
     smoothing  ms — time constant of the ease between states       (240)
     seed       integer — same seed = same wreck on every load      (7)
   Direction — the cursor's motion drags the wreck along with it:
     speed      px/s of cursor motion at which the drag is total    (1200)
     drag       em — glyphs pulled along the motion                 (0.4)
     lean       deg — glyphs tilt into horizontal motion            (22)
     skew       deg — glyphs slant along the motion                 (26)
     stretch    glyphs elongate along the axis of motion            (0.35)
     smear      em — filter dilation along the motion (bolder edge) (0.08)
   ========================================================= */
(function (global) {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var REDUCED_MOTION = global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DEFAULTS = {
    delay: 333,
    radius: 0,
    inner: 16,
    liquid: 0.4,
    goo: 0.045,
    thicken: 0.035,
    melt: 0.4,
    shift: 0.2,
    rotate: 16,
    scale: 0.2,
    jitter: 1,
    flicker: 0.35,
    smoothing: 240,
    seed: 7,
    speed: 1200,
    drag: 0.4,
    lean: 22,
    skew: 26,
    stretch: 0.35,
    smear: 0.08,
    // noise frequency in cycles / em (x y) — low, so the outline flows in long slow waves instead of tearing
    frequency: [0.9, 1.4]
  };

  /* ---------- helpers ---------- */

  // mulberry32 — deterministic per-glyph randomness
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // random sign × magnitude in [0.45, 1] — every glyph visibly moves, none sits still
  function spread(r) { return (r() < 0.5 ? -1 : 1) * (0.45 + r() * 0.55); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smoothstep(t) { return t * t * (3 - 2 * t); }
  function graphemes(text) {
    if (global.Intl && Intl.Segmenter) {
      return Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text), function (s) { return s.segment; });
    }
    return Array.from(text);
  }
  function readDataset(el) {
    var out = {};
    Object.keys(DEFAULTS).forEach(function (k) {
      var v = el.dataset['entropy' + k.charAt(0).toUpperCase() + k.slice(1)];
      if (v == null) return;
      if (k === 'frequency') out[k] = v.split(/[\s,]+/).map(Number);
      else out[k] = Number(v);
    });
    return out;
  }

  /* ---------- shared pointer state (one set of listeners for every instance) ---------- */

  var pointer = null;        // { x, y, t } in viewport px, or null when the cursor is outside the window / unknown
  var vx = 0, vy = 0;        // cursor velocity, px/s, lightly smoothed across events
  var IDLE_MS = 90;          // no move event for this long = the cursor has stopped
  var instances = [];
  var listening = false;

  function wakeAll() { for (var i = 0; i < instances.length; i++) instances[i].wake(); }
  function invalidateAll() { for (var i = 0; i < instances.length; i++) instances[i].invalidate(); }
  function refitAll() { for (var i = 0; i < instances.length; i++) instances[i].refit(); }

  function listen() {
    if (listening) return;
    listening = true;
    var onMove = function (e) {
      var now = performance.now();
      if (pointer) {
        var dt = now - pointer.t;
        if (dt > 0 && dt < 200) {
          vx += ((e.clientX - pointer.x) / dt * 1000 - vx) * 0.5;
          vy += ((e.clientY - pointer.y) / dt * 1000 - vy) * 0.5;
        }
      }
      pointer = { x: e.clientX, y: e.clientY, t: now };
      wakeAll();
    };
    global.addEventListener('pointermove', onMove, { passive: true });
    global.addEventListener('pointerdown', onMove, { passive: true });
    // leaving the window counts as "far away"
    document.addEventListener('mouseout', function (e) { if (!e.relatedTarget) { pointer = null; wakeAll(); } });
    global.addEventListener('resize', refitAll);
    global.addEventListener('scroll', invalidateAll, { passive: true, capture: true });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) wakeAll(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitAll);
  }

  var uid = 0;

  /* ---------- the component ---------- */

  function EntropyText(el, opts) {
    this.el = el;
    el.__entropy = this;        // EntropyText.get(el)
    this.o = Object.assign({}, DEFAULTS, readDataset(el), opts || {});
    this.i = 0;                 // current intensity, eased
    this.target = 0;
    this.fx = 0; this.fy = 0;   // flow: where the cursor is heading, |f| ≤ 1, eased
    this.lastSmear = '';
    this.armed = false;
    this.running = false;
    this.applied = false;
    this.fontSize = 0;
    this.lastLevel = -1;
    this.seedAt = 0;
    this.seedN = this.o.seed;

          gl.uniform1f(U.uDensity, P.density); gl.uniform1f(U.uFeedback, P.feedback); gl.uniform1f(U.uDomainWarp, P.domainWarp);

      [/compan|\bwork(ed)?\b|employer|career|history|clients|projects|portfolio|cases?\b/i,
       'TradeRadar, MOEX trading terminal \u2014 Jul 2024 \u2013 present.\nWYA Venue Operations Center, Where You At (London) \u2014 Nov 2023 \u2013 Jun 2024.\nSwordfish Security, AppSec.Track & AppSec.Hub \u2014 Nov 2021 \u2013 Feb 2024.\nFreelance Product Designer \u2014 May 2019 \u2013 present.'],
      [/what does anton|what do you do|who is|who are|about anton|tell me about anton|introduce|what is anton|his role|his job|position|title/i,
       'Anton Dubovik \u2014 Senior Product Designer. Seven years in fintech and DevSecOps enterprise B2B: designs complex products end to end \u2014 research, flows, UI \u2014 and builds the design systems and AI workflows that keep them consistent.'],
      [/^\s*(hi|hello|hey|yo|good (morning|afternoon|evening))\b/i,
       'Hi. Ask anything that is in Anton\u2019s CV \u2014 experience, companies, metrics, design systems, tools, education, contacts.']
    ];
    const NOT_IN_CV = 'That isn\u2019t in the CV. Ask about experience, companies, metrics, design systems, tools, education or contacts.';
    const answer = (q) => { const hit = KB.find(([re]) => re.test(q)); return hit ? hit[1] : NOT_IN_CV; };
    window.nodesignAnswer = answer; // try it in the console

    /* ---------- chat mode ---------- */
    const thread = document.getElementById('thread');
    const branches = document.getElementById('branches');
    const plateWrap = document.querySelector('.plate-wrap');
    const heroCopy = document.querySelector('.hero-copy');
    // the thread needs to clear the docked composer, whatever its height
    const fitComposer = () => root.style.setProperty('--composer-h', plateWrap.offsetHeight + 'px');
    new ResizeObserver(fitComposer).observe(plateWrap);
    fitComposer();

    const enterChat = () => {
      if (document.body.classList.contains('is-chat')) return;
      const from = plateWrap.getBoundingClientRect();
      document.body.classList.add('is-chat');
      fitComposer();
      // FLIP: the composer slides from the centre to its dock instead of jumping
      if (!reduced.matches) {
        const to = plateWrap.getBoundingClientRect();
        const scale = parseFloat(token('--ui-scale')) || 1;
        plateWrap.style.transition = 'none';
        plateWrap.style.translate = `${(from.left - to.left) / scale}px ${(from.top - to.top) / scale}px`;
        plateWrap.getBoundingClientRect();
        plateWrap.style.transition = `translate var(--dur-panel) var(--ease-out)`;
        plateWrap.style.translate = '0 0';
        const settle = () => { plateWrap.style.transition = ''; plateWrap.style.translate = ''; };
        plateWrap.addEventListener('transitionend', settle, { once: true });
        setTimeout(settle, 400);   // in case the tab is hidden and the transition never runs
      }
    };
    const exitChat = () => {
      document.body.classList.remove('is-chat');
      thread.textContent = ''; branches.querySelectorAll('.branch').forEach(b => b.remove());
      scrollTo(0, 0);
    };

    const addMsg = (cls, html, asText) => {
      const el = document.createElement('div'); el.className = 'msg ' + cls;
      if (asText) el.textContent = html; else el.innerHTML = html;
      thread.appendChild(el); return el;
    };
    const timeNow = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const COPY_ICON = '<svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.1"/><path d="M7.5 3.5V2.7A1.2 1.2 0 0 0 6.3 1.5H2.7A1.2 1.2 0 0 0 1.5 2.7v3.6a1.2 1.2 0 0 0 1.2 1.2h.8" stroke="currentColor" stroke-width="1.1"/></svg>';
    const addAnswer = (html) => {
      const el = addMsg('msg-a', `<div class="text">${html}</div><div class="meta"><span class="time">${timeNow()}</span><button type="button" class="copy quiet">${COPY_ICON}<span>copy</span></button></div>`);
      const btn = el.querySelector('.copy'), label = btn.querySelector('span');
      btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(el.querySelector('.text').innerText); label.textContent = 'copied'; }
        catch (err) {   // clipboard blocked → select the answer so ⌘C / Ctrl+C works
          const range = document.createRange(); range.selectNodeContents(el.querySelector('.text'));
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
          label.textContent = 'selected';
        }
        setTimeout(() => { label.textContent = 'copy'; }, 1500);
      });
      return el;
    };
    const addBranch = (q, target) => {
      branches.querySelectorAll('.branch').forEach(b => b.classList.remove('is-active'));
      const b = document.createElement('button'); b.type = 'button'; b.className = 'branch quiet is-active'; b.textContent = q; b.title = q;
      b.addEventListener('click', () => {
        branches.querySelectorAll('.branch').forEach(x => x.classList.toggle('is-active', x === b));
        target.scrollIntoView({ behavior: reduced.matches ? 'auto' : 'smooth', block: 'start' });
      });
      branches.appendChild(b); branches.scrollTop = branches.scrollHeight;
    };
    const scrollToEnd = () => scrollTo({ top: document.documentElement.scrollHeight, behavior: reduced.matches ? 'auto' : 'smooth' });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = ta.value.trim(); if (!q) return;
      ta.value = ''; sync(); ta.focus();
      enterChat();
      const qEl = addMsg('msg-q', q, true);
      addBranch(q, qEl);
      const typing = addMsg('msg-a typing', '<i></i><i></i><i></i>');
      scrollToEnd();
      setTimeout(() => { typing.remove(); addAnswer(answer(q)); scrollToEnd(); }, reduced.matches ? 0 : 650);
    });
    // Escape with an empty field leaves the chat and brings the hero back
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('is-chat') && !ta.value) exitChat();
    });
    sync();

    // placeholder cycles real scenarios, blur in / blur out
    let phEl = phText;                       // the element currently on screen (each cycle swaps it)
    const nextScenario = () => {
      si = (si + 1) % scenarios.length;
      const fresh = phEl.cloneNode(false);
      fresh.textContent = scenarios[si];
      phEl.replaceWith(fresh);
      phEl = fresh;
      fresh.addEventListener('animationend', nextScenario);
    };
    phEl.addEventListener('animationend', nextScenario);

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

    /* ---------- mobile menu ---------- */
    const menu = document.getElementById('menu');
    const menuBtn = menu.querySelector('.menu-btn');
    const menuList = menu.querySelector('.menu-list-wrap');
    const setMenu = (open) => { menu.classList.toggle('is-open', open); menuBtn.setAttribute('aria-expanded', String(open)); menuList.inert = !open; };
    setMenu(false);
    menuBtn.addEventListener('click', () => setMenu(!menu.classList.contains('is-open')));
    document.addEventListener('click', (e) => { if (!e.target.closest('#menu')) setMenu(false); });
  })();
  </script>

</body>
</html>
